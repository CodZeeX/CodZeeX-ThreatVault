title: Detect Suspicious Windows Scheduled Task Creation - Variant 1790
id: 9e13cfec2bb1385e8ec8a9469148de0b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.persistence
    - attack.t1190
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1790.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1790'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 860
id: 984ef7ddc0743694543929bdd2ccd11d
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-12
tags:
    - attack.collection
    - attack.t1060
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_860.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_860'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

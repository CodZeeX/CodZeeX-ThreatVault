title: Detect Suspicious Windows Scheduled Task Creation - Variant 1440
id: 8470d09437d19ae0ee2d29ef1a87792d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-16
tags:
    - attack.initial_access
    - attack.t1640
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1440.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1440'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

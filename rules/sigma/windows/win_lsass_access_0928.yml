title: Detect Suspicious Windows Process Access - Variant 928
id: 38d82c6afcba89d4cae5432ee1fb41d3
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-17
tags:
    - attack.defense_evasion
    - attack.t1128
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_928.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_928'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1674
id: 08c5acf4470c5c28d0d17a8ae90341e5
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.discovery
    - attack.t1074
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1674.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1674'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 2376
id: 0635e9180592d924d023c59971ab7dfe
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.initial_access
    - attack.t1776
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2376.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2376'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

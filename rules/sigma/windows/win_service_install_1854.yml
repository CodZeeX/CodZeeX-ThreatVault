title: Detect Suspicious Windows Service Installation - Variant 1854
id: 57f792415423403282eb11697ef3a857
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-10
tags:
    - attack.discovery
    - attack.t1254
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1854.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1854'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 1934
id: c741316cb3e76e31f0d41ab3703d858d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.persistence
    - attack.t1334
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1934.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1934'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

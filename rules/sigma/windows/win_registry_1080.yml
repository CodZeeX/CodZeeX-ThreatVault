title: Detect Suspicious Windows Registry Event - Variant 1080
id: 666e53986d61d1fa0f047c8dc652cf81
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-26
tags:
    - attack.initial_access
    - attack.t1280
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1080.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1080'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

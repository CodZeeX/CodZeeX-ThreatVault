title: Detect Suspicious Windows Process Creation - Variant 2660
id: 4cdcc86981db734e863437fd00bd0ba0
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-30
tags:
    - attack.collection
    - attack.t1260
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2660.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2660'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1898
id: 3d12d954ebb294396d84de20e9b3a9c0
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.persistence
    - attack.t1298
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1898.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1898'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1980
id: 48a75888977d527471bf5d450c45905a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-19
tags:
    - attack.initial_access
    - attack.t1380
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1980.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1980'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

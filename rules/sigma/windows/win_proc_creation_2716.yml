title: Detect Suspicious Windows Process Creation - Variant 2716
id: 778bb4198298c1c07da87c816fc224a1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.defense_evasion
    - attack.t1316
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2716.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2716'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

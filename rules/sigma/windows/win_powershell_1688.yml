title: Detect Suspicious Windows Ps Script - Variant 1688
id: d2223041ef857e8ef5aa2150e425c643
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.collection
    - attack.t1088
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1688.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1688'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

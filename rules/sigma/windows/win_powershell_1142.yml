title: Detect Suspicious Windows Ps Script - Variant 1142
id: 2633199fda31bcb8524e7d42f2d97511
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-30
tags:
    - attack.persistence
    - attack.t1342
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1142.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1142'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

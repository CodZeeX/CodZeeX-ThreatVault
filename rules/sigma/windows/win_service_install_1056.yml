title: Detect Suspicious Windows Service Installation - Variant 1056
id: ef5dcdfd8eca5fd366036c893ec57044
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-25
tags:
    - attack.initial_access
    - attack.t1256
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1056.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1056'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

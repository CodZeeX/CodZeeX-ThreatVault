title: Detect Suspicious Windows Ps Script - Variant 960
id: d56ea4c66f8f28fb072e13f78a98df0e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-19
tags:
    - attack.initial_access
    - attack.t1160
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_960.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_960'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

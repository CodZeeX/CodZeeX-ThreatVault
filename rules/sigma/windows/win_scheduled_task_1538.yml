title: Detect Suspicious Windows Scheduled Task Creation - Variant 1538
id: 3f599da46f2c3b560bd1fe1dcc546517
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-22
tags:
    - attack.persistence
    - attack.t1738
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1538.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1538'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 404
id: 6ba751e00c28024c08744cadaa566141
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-09
tags:
    - attack.collection
    - attack.t1404
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_404.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_404'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

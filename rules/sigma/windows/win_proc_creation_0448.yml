title: Detect Suspicious Windows Process Creation - Variant 448
id: 450e570c3707664e9171155e603867e3
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-12
tags:
    - attack.defense_evasion
    - attack.t1448
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_448.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_448'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

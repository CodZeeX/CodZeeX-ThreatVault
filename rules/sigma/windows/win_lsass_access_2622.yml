title: Detect Suspicious Windows Process Access - Variant 2622
id: 6b44b1fe6cbf9a85909f1fafd6dd362f
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.discovery
    - attack.t1222
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2622.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2622'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

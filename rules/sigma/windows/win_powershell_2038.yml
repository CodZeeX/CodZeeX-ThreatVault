title: Detect Suspicious Windows Ps Script - Variant 2038
id: c3c1cd64f41b0a30b225f7ca31943452
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.exfiltration
    - attack.t1438
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2038.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2038'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

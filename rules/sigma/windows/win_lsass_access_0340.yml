title: Detect Suspicious Windows Process Access - Variant 340
id: 66038af54edb4651568fdb34e1c71716
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-04
tags:
    - attack.defense_evasion
    - attack.t1340
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_340.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_340'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2002
id: 93908b9811e2fe09ec4be4e7ea9070d4
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-20
tags:
    - attack.exfiltration
    - attack.t1402
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2002.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2002'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

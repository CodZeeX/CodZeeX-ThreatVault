title: Detect Suspicious Windows Ps Script - Variant 2626
id: e93b69f7e4c0b1719e6e42e525b539c4
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.exfiltration
    - attack.t1226
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2626.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2626'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

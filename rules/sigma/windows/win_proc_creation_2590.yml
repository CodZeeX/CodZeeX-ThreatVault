title: Detect Suspicious Windows Process Creation - Variant 2590
id: c3ce6227b69a9727e955cc0977c039e5
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-25
tags:
    - attack.exfiltration
    - attack.t1190
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2590.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2590'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 392
id: 3180e1bf49b56d02bc5623490a964815
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-08
tags:
    - attack.collection
    - attack.t1392
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_392.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_392'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

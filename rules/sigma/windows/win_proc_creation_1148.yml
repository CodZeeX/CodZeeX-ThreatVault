title: Detect Suspicious Windows Process Creation - Variant 1148
id: 20eadd32e366b4e0225200e532072f51
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.collection
    - attack.t1348
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1148.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1148'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

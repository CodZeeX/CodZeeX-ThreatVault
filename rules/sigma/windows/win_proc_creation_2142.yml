title: Detect Suspicious Windows Process Creation - Variant 2142
id: 3240a8b2b2c9538efdf7d029426bb986
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-28
tags:
    - attack.discovery
    - attack.t1542
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2142.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2142'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

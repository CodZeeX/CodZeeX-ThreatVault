title: Detect Suspicious Windows Scheduled Task Creation - Variant 1902
id: 49d8129436f2cc73ab41cae835ccfa73
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.discovery
    - attack.t1302
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1902.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1902'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

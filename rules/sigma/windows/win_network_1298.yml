title: Detect Suspicious Windows Network Connection - Variant 1298
id: 24c7ede9aeddb434c267b7b313a11fe6
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-08
tags:
    - attack.persistence
    - attack.t1498
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1298.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1298'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1464
id: 85d4de2676c733db81f800649b4db311
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.initial_access
    - attack.t1664
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1464.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1464'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

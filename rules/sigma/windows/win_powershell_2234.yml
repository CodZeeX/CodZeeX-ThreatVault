title: Detect Suspicious Windows Ps Script - Variant 2234
id: 180e219f9a466987996d30f1415ce4b4
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-02
tags:
    - attack.persistence
    - attack.t1634
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2234.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2234'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

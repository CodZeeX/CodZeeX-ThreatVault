title: Detect Suspicious Windows Scheduled Task Creation - Variant 670
id: 023c2574e6799a407eaac03687062661
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-26
tags:
    - attack.exfiltration
    - attack.t1670
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_670.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_670'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

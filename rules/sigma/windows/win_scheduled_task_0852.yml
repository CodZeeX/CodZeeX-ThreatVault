title: Detect Suspicious Windows Scheduled Task Creation - Variant 852
id: 8afa36c36ffae781aa407a29a1050f2c
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.initial_access
    - attack.t1052
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_852.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_852'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

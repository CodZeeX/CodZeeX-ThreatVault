title: Detect Suspicious Windows Ps Script - Variant 1744
id: 79a252393c8195468d6dafae0955169b
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-04
tags:
    - attack.defense_evasion
    - attack.t1144
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1744.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1744'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

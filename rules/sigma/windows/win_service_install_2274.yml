title: Detect Suspicious Windows Service Installation - Variant 2274
id: d04cd390fd86cccefc85e163789d133b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.discovery
    - attack.t1674
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2274.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2274'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

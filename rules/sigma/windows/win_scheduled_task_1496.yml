title: Detect Suspicious Windows Scheduled Task Creation - Variant 1496
id: 718d59a3fda1338b1fc93fc9493574fd
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.collection
    - attack.t1696
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1496.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1496'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 748
id: 8de77aa758bfedbf1480c985c5f63d1d
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.defense_evasion
    - attack.t1748
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_748.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_748'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

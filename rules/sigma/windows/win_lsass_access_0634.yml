title: Detect Suspicious Windows Process Access - Variant 634
id: 3d3a9fa2e82e01636bd5a87a20312a6e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-24
tags:
    - attack.exfiltration
    - attack.t1634
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_634.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_634'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

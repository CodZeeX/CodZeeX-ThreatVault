title: Detect Suspicious Windows Process Access - Variant 886
id: d0f56e10828b3ec8f815ea8bec764515
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-13
tags:
    - attack.exfiltration
    - attack.t1086
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_886.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_886'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

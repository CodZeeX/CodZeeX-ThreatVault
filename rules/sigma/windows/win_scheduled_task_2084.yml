title: Detect Suspicious Windows Scheduled Task Creation - Variant 2084
id: 19fbf630069aba509e07982dbf5ac9c6
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.collection
    - attack.t1484
logsource:
    category: scheduled_task_creation
    product: windows
detection:

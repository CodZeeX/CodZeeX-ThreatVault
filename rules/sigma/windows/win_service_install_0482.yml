title: Detect Suspicious Windows Service Installation - Variant 482
id: 75f8e56f4db2071e7f32e3ea990185ad
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.persistence
    - attack.t1482
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_482.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_482'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

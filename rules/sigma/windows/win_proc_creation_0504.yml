title: Detect Suspicious Windows Process Creation - Variant 504
id: 660f59f9be9fe9632ce264a1e7e0ab14
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-15
tags:
    - attack.initial_access
    - attack.t1504
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_504.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_504'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

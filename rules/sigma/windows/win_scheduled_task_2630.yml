title: Detect Suspicious Windows Scheduled Task Creation - Variant 2630
id: ac8e76b29dc2c6a3249c42b4b37498ea
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.persistence
    - attack.t1230
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2630.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2630'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

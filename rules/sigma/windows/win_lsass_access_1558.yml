title: Detect Suspicious Windows Process Access - Variant 1558
id: 7a3bce0faebb7407b017e850034a4c12
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-23
tags:
    - attack.exfiltration
    - attack.t1758
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1558.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1558'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1974
id: ad445a4a16f5e17c8690252e4e7fc114
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-18
tags:
    - attack.discovery
    - attack.t1374
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1974.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1974'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

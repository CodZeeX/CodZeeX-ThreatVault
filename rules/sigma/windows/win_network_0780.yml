title: Detect Suspicious Windows Network Connection - Variant 780
id: a07b2add627a5acf56b6d46e5538e428
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-06
tags:
    - attack.initial_access
    - attack.t1780
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_780.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_780'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

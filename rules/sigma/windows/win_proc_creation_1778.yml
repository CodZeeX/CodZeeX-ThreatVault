title: Detect Suspicious Windows Process Creation - Variant 1778
id: fe6aba25b0a670e478033413cb29ff8a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.persistence
    - attack.t1178
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1778.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1778'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

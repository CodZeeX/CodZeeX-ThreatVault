title: Detect Suspicious Windows Process Creation - Variant 2688
id: 19bc9e2c1da5a4cb4a651a8612d2d469
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.initial_access
    - attack.t1288
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2688.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2688'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

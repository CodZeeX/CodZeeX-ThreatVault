title: Detect Suspicious Windows Scheduled Task Creation - Variant 1076
id: b73f5119c73384454993f885b7be9c6d
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-26
tags:
    - attack.collection
    - attack.t1276
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1076.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1076'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

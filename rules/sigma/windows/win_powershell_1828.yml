title: Detect Suspicious Windows Ps Script - Variant 1828
id: 66d98861b540f5211afb2c84ab50897b
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-09
tags:
    - attack.defense_evasion
    - attack.t1228
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1828.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1828'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

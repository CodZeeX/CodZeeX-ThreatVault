title: Detect Suspicious Windows Network Connection - Variant 2698
id: 9bee81010cbf217892e1825a2afa4cde
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-02
tags:
    - attack.exfiltration
    - attack.t1298
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2698.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2698'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

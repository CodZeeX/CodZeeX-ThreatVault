title: Detect Suspicious Windows Registry Event - Variant 2760
id: 87b913de60feb6f2cce97f6f99cb3b97
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-05
tags:
    - attack.initial_access
    - attack.t1360
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2760.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2760'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

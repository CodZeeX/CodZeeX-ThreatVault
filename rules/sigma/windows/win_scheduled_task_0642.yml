title: Detect Suspicious Windows Scheduled Task Creation - Variant 642
id: a91502344d9e2039a14c89dbc63292c9
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.discovery
    - attack.t1642
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_642.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_642'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2438
id: 21d767be1a6142fd67ab4ed7b6ceeba2
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-15
tags:
    - attack.persistence
    - attack.t1038
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2438.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2438'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

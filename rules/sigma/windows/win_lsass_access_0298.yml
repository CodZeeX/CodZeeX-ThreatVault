title: Detect Suspicious Windows Process Access - Variant 298
id: 5ca2bdd60dc709e44df7987e1a890bd9
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-01
tags:
    - attack.exfiltration
    - attack.t1298
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_298.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_298'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

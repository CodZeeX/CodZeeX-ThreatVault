title: Detect Suspicious Windows Ps Script - Variant 2696
id: 2febc5904abc39422518ad4252b0ad0b
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-02
tags:
    - attack.collection
    - attack.t1296
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2696.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2696'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

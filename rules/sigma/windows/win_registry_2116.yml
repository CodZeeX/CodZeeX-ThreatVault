title: Detect Suspicious Windows Registry Event - Variant 2116
id: b889f75d68409bc3088d98c5ac0f9467
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-26
tags:
    - attack.defense_evasion
    - attack.t1516
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2116.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2116'
    condition: selection

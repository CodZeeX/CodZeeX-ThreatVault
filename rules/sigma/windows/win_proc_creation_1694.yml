title: Detect Suspicious Windows Process Creation - Variant 1694
id: c18bff77824c189856e9f279d57cbeb5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.persistence
    - attack.t1094
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1694.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1694'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1484
id: d9095bca99dd31d422e83261a6dda0f6
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.collection
    - attack.t1684
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1484.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1484'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1608
id: 8e3092139b073a8256f1d742565eb5af
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-26
tags:
    - attack.initial_access
    - attack.t1008
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1608.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1608'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

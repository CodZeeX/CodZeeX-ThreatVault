title: Detect Suspicious Windows Process Access - Variant 1124
id: b4b56e09bca9b3e8bc51277647fc06b3
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.collection
    - attack.t1324
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1124.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1124'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

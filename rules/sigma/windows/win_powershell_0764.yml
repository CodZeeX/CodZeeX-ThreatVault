title: Detect Suspicious Windows Ps Script - Variant 764
id: 11c3101d96af8108c9b677315e3c701d
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-04
tags:
    - attack.collection
    - attack.t1764
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_764.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_764'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

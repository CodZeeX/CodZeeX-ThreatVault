title: Detect Suspicious Windows Service Installation - Variant 1224
id: de388fd5193c53c11ac5e72de3c2231e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.initial_access
    - attack.t1424
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1224.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1224'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 958
id: 97fab434486630b1e2b3b9ab540c3949
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-19
tags:
    - attack.exfiltration
    - attack.t1158
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_958.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_958'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1008
id: e321530257e75248c8334cf8fc954f67
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.initial_access
    - attack.t1208
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1008.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1008'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

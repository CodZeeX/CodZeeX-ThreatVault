title: Detect Suspicious Windows Process Access - Variant 2048
id: 1f54aa763dd78c17a61e49b317503203
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.collection
    - attack.t1448
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2048.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2048'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 108
id: de41144c95cc2b4a6f81a8bc2ea7bcbd
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-21
tags:
    - attack.initial_access
    - attack.t1108
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_108.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_108'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

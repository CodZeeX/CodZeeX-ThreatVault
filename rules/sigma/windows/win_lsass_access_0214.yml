title: Detect Suspicious Windows Process Access - Variant 214
id: 603da87b5281150f237b8ef8ce709e55
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.exfiltration
    - attack.t1214
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_214.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_214'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1202
id: e27925f986d670ab321f37730215e154
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.persistence
    - attack.t1402
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1202.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1202'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2186
id: 4cc2fbd984c6f36a25e9070f8880df36
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-30
tags:
    - attack.persistence
    - attack.t1586
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2186.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2186'
    condition: selection
falsepositives:

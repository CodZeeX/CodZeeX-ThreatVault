title: Detect Suspicious Windows Scheduled Task Creation - Variant 194
id: a8d66fac6a326d1dbc01803b0939a421
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-26
tags:
    - attack.persistence
    - attack.t1194
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_194.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_194'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2212
id: ff2b50a74a08c9bb16d6464e6f3c8ebd
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-01
tags:
    - attack.defense_evasion
    - attack.t1612
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2212.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2212'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

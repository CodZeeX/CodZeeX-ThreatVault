title: Detect Suspicious Windows Network Connection - Variant 612
id: 76587fe3bf09701347d65b52303b42a6
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-23
tags:
    - attack.initial_access
    - attack.t1612
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_612.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_612'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

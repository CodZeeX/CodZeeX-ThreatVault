title: Detect Suspicious Windows Scheduled Task Creation - Variant 2406
id: 7187774d7d0595f1b954551b534c4af2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-13
tags:
    - attack.discovery
    - attack.t1006
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2406.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2406'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

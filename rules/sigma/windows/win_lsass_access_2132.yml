title: Detect Suspicious Windows Process Access - Variant 2132
id: ae5b99068d9d228d3f1eb2395f7b57eb
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-27
tags:
    - attack.collection
    - attack.t1532
logsource:
    category: process_access
    product: windows
detection:

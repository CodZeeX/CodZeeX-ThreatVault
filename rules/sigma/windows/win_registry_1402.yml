title: Detect Suspicious Windows Registry Event - Variant 1402
id: 1b8971289ee2401493296605c5b5aa0e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.exfiltration
    - attack.t1602
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1402.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1402'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 456
id: 189c46ce5d103d5202a2a827bfea3e7f
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-12
tags:
    - attack.initial_access
    - attack.t1456
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_456.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_456'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

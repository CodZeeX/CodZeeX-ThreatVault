title: Detect Suspicious Windows Process Creation - Variant 1736
id: 78db52cc5c6ef3459d9ff5d10640b60c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-03
tags:
    - attack.collection
    - attack.t1136
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1736.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1736'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

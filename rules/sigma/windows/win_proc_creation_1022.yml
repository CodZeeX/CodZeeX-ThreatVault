title: Detect Suspicious Windows Process Creation - Variant 1022
id: 1c9c911ed462ac425effc7186e81ff88
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-22
tags:
    - attack.persistence
    - attack.t1222
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1022.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1022'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

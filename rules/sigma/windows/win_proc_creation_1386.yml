title: Detect Suspicious Windows Process Creation - Variant 1386
id: adaff84ee1f57bd5988f0c9b2bcc2b07
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.discovery
    - attack.t1586
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1386.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1386'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

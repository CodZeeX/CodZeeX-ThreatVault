title: Detect Suspicious Windows Service Installation - Variant 2092
id: 98093deb464b18fb5006ebc584183160
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-25
tags:
    - attack.defense_evasion
    - attack.t1492
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2092.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2092'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

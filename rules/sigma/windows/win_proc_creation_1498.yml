title: Detect Suspicious Windows Process Creation - Variant 1498
id: 9c73d70157316f8ea9b74399b78e68d3
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-20
tags:
    - attack.exfiltration
    - attack.t1698
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1498.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1498'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

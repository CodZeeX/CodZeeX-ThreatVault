title: Detect Suspicious Windows Service Installation - Variant 2666
id: 1f13d0128eb358be0703fdf078d73b5c
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-30
tags:
    - attack.persistence
    - attack.t1266
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2666.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2666'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 2512
id: a52c104755df10a4ce3638a5c0750bd9
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-20
tags:
    - attack.defense_evasion
    - attack.t1112
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2512.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2512'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

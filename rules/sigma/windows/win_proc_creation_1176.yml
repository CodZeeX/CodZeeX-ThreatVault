title: Detect Suspicious Windows Process Creation - Variant 1176
id: 3c349b83ec56cd76606dc434316e1ba5
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.initial_access
    - attack.t1376
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1176.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1176'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2584
id: 8d70acc5687eb9fe54c244d1bdbc8c20
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.defense_evasion
    - attack.t1184
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2584.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2584'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

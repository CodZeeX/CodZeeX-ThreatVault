title: Detect Suspicious Windows Process Access - Variant 2160
id: b52a8cbbde6e48daa4abf6e6e344931c
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-29
tags:
    - attack.initial_access
    - attack.t1560
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2160.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2160'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 328
id: d22ec6fc7f164e73b3ea1fe6945cad5f
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-03
tags:
    - attack.defense_evasion
    - attack.t1328
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_328.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_328'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

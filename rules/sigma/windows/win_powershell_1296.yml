title: Detect Suspicious Windows Ps Script - Variant 1296
id: 32630bd9caa564de0beed7ce4144cb9a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-08
tags:
    - attack.initial_access
    - attack.t1496
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1296.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1296'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

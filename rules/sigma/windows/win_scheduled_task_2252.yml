title: Detect Suspicious Windows Scheduled Task Creation - Variant 2252
id: 55522f02ec4adaa3b671809551076cfa
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.collection
    - attack.t1652
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2252.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2252'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

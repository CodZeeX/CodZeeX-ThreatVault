title: Detect Suspicious Windows Scheduled Task Creation - Variant 1062
id: f18cacf6945e5299adb8fc7f1d266746
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-25
tags:
    - attack.discovery
    - attack.t1262
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1062.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1062'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

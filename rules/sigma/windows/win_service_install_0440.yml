title: Detect Suspicious Windows Service Installation - Variant 440
id: 9111ed63c66e3cdac1ae2ade7d3c32d6
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.collection
    - attack.t1440
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_440.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_440'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

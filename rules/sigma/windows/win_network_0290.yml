title: Detect Suspicious Windows Network Connection - Variant 290
id: 5c2247908ac559729339459ef7dad963
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-31
tags:
    - attack.persistence
    - attack.t1290
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_290.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_290'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

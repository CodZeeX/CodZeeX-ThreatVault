title: Detect Suspicious Windows Scheduled Task Creation - Variant 1244
id: 9d331150146eda99b4c66a9f9a0e600b
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.collection
    - attack.t1444
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1244.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1244'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

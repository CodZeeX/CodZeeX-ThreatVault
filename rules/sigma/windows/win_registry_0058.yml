title: Detect Suspicious Windows Registry Event - Variant 58
id: df4c6594380f0303136ef34d1b9da0e6
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-17
tags:
    - attack.exfiltration
    - attack.t1058
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_58.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_58'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

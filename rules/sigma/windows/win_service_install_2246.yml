title: Detect Suspicious Windows Service Installation - Variant 2246
id: 6cf8e6149efb4b635c798ea497b3d5c3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.persistence
    - attack.t1646
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2246.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2246'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

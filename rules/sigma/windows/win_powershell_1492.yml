title: Detect Suspicious Windows Ps Script - Variant 1492
id: 399e2ab1bd7377d6f25d363ae1d4bb96
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.defense_evasion
    - attack.t1692
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1492.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1492'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 232
id: 4173bb6f98d03eb93a90ee042041eeb1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-28
tags:
    - attack.defense_evasion
    - attack.t1232
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_232.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_232'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

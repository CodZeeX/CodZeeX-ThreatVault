title: Detect Suspicious Windows Registry Event - Variant 2354
id: c7705d8314bdc03e5fdf346b5bc737d1
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.persistence
    - attack.t1754
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2354.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2354'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

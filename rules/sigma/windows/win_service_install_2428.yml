title: Detect Suspicious Windows Service Installation - Variant 2428
id: 8a421f690c229f7d6b923ecafc14b92d
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-14
tags:
    - attack.defense_evasion
    - attack.t1028
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2428.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2428'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

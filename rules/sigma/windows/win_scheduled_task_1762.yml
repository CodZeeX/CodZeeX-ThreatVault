title: Detect Suspicious Windows Scheduled Task Creation - Variant 1762
id: 32b47c6d6e01f9728898b87de39d14c9
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.exfiltration
    - attack.t1162
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1762.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1762'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2088
id: 42c4d1ce84f1b7b30d6581716e404a56
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.initial_access
    - attack.t1488
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2088.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2088'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

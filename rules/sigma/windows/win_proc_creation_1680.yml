title: Detect Suspicious Windows Process Creation - Variant 1680
id: d51c2bb7e3bc91a7e60dfab1d6ca42e6
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-30
tags:
    - attack.initial_access
    - attack.t1080
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1680.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1680'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

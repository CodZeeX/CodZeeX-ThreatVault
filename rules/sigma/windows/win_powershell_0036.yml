title: Detect Suspicious Windows Ps Script - Variant 36
id: 977ac32325d40febe9ecd4a6f11fc9cb
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-15
tags:
    - attack.initial_access
    - attack.t1036
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_36.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_36'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1810
id: 101f6a6a54e7f53960773f02a36d0eb7
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-08
tags:
    - attack.exfiltration
    - attack.t1210
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1810.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1810'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 406
id: 09528b96be88c2deef9436eac707ef60
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-09
tags:
    - attack.exfiltration
    - attack.t1406
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_406.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_406'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

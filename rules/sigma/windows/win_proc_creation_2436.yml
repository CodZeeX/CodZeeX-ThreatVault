title: Detect Suspicious Windows Process Creation - Variant 2436
id: 53890135c9ca9784e9443772357f07fe
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-15
tags:
    - attack.initial_access
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2436.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2436'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

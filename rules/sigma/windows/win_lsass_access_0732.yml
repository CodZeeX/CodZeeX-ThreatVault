title: Detect Suspicious Windows Process Access - Variant 732
id: 690a69d691aadcb13c504024fcb3c3b1
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.initial_access
    - attack.t1732
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_732.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_732'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 2474
id: bc1564a3d5f0ac6c23630e1afb0d4d57
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-17
tags:
    - attack.persistence
    - attack.t1074
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2474.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2474'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

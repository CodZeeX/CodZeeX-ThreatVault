title: Detect Suspicious Windows Network Connection - Variant 2306
id: dc9cac2d68773d91dea22879cebcf501
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.persistence
    - attack.t1706
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2306.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2306'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 2078
id: e6e5aafb001370bb0cc70fb3978a75f3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.persistence
    - attack.t1478
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2078.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2078'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

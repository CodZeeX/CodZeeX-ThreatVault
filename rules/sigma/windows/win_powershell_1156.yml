title: Detect Suspicious Windows Ps Script - Variant 1156
id: a4b259cbcab8c073189e7217fd235b27
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.defense_evasion
    - attack.t1356
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1156.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1156'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

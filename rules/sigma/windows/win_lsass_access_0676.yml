title: Detect Suspicious Windows Process Access - Variant 676
id: 7e2b87deb1fe16f71c21c33a0405c321
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-26
tags:
    - attack.defense_evasion
    - attack.t1676
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_676.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_676'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

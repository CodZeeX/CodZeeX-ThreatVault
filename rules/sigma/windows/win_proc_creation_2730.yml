title: Detect Suspicious Windows Process Creation - Variant 2730
id: 3053db6a147628a5094b8707541d63c8
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.discovery
    - attack.t1330
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2730.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2730'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

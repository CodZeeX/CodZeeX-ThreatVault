title: Detect Suspicious Windows Process Creation - Variant 2352
id: 7276b18eec8e594f621ce4bd8e6bd039
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.initial_access
    - attack.t1752
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2352.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2352'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

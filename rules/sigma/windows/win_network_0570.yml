title: Detect Suspicious Windows Network Connection - Variant 570
id: c90628fd573e9fc262deaa8fd8bdf731
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-20
tags:
    - attack.discovery
    - attack.t1570
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_570.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_570'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

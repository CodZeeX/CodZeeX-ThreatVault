title: Detect Suspicious Windows Ps Script - Variant 1954
id: 1566b87ee8865c7a4a9cc263a9ed8cf2
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-17
tags:
    - attack.exfiltration
    - attack.t1354
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1954.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1954'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

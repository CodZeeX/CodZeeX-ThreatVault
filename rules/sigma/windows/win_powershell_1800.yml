title: Detect Suspicious Windows Ps Script - Variant 1800
id: b6d1b11a44244af3456e60fe93869f1e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-07
tags:
    - attack.initial_access
    - attack.t1200
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1800.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1800'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

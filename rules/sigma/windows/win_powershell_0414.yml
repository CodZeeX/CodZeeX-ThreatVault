title: Detect Suspicious Windows Ps Script - Variant 414
id: 37a9feae59e892306b2421aee731c517
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-10
tags:
    - attack.discovery
    - attack.t1414
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_414.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_414'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

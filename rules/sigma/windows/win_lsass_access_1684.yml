title: Detect Suspicious Windows Process Access - Variant 1684
id: 9724000f6104993983cb85e3a4b5709a
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-30
tags:
    - attack.defense_evasion
    - attack.t1084
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1684.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1684'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

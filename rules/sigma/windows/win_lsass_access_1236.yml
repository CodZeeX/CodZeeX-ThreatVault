title: Detect Suspicious Windows Process Access - Variant 1236
id: b79785002a81c84e8f60be5fea43c952
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.initial_access
    - attack.t1436
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1236.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1236'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

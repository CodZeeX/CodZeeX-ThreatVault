title: Detect Suspicious Windows Scheduled Task Creation - Variant 978
id: d71b26d80674c4a2b31cf7e35efc358a
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-20
tags:
    - attack.discovery
    - attack.t1178
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_978.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_978'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

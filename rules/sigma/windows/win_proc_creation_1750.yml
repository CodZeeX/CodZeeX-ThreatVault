title: Detect Suspicious Windows Process Creation - Variant 1750
id: f7f908dac6f00b7c1f576016c23088a6
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.exfiltration
    - attack.t1150
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1750.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1750'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

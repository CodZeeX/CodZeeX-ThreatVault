title: Detect Suspicious Windows Service Installation - Variant 2232
id: df68ad6589a622300d1777ae49543106
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-02
tags:
    - attack.initial_access
    - attack.t1632
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2232.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2232'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1586
id: 85d263039ef3f9e1dae77df617d216b8
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.persistence
    - attack.t1786
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1586.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1586'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

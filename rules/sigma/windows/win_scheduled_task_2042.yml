title: Detect Suspicious Windows Scheduled Task Creation - Variant 2042
id: 17ff3138bdb408f61fef7b40b023289b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.persistence
    - attack.t1442
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2042.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2042'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

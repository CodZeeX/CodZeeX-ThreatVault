title: Detect Suspicious Windows Registry Event - Variant 1948
id: 6b190883411e44198f4cce90d1fb9864
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.defense_evasion
    - attack.t1348
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1948.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1948'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

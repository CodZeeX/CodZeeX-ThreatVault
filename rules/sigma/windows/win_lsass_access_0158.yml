title: Detect Suspicious Windows Process Access - Variant 158
id: a43d2f0d8aa6d5d0c47efb4e82d6a3db
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.persistence
    - attack.t1158
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_158.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_158'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

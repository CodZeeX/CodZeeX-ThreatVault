title: Detect Suspicious Windows Network Connection - Variant 1732
id: 17a056594b855fd056158319d825cfbf
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-03
tags:
    - attack.defense_evasion
    - attack.t1132
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1732.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1732'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

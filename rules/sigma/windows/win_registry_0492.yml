title: Detect Suspicious Windows Registry Event - Variant 492
id: bf7657a546fcd426e11de9ec3b8aabc2
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.initial_access
    - attack.t1492
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_492.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_492'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

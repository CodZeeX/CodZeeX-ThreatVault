title: Detect Suspicious Windows Scheduled Task Creation - Variant 950
id: e14addfac8282be5664c68dc6af2fec5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-18
tags:
    - attack.persistence
    - attack.t1150
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_950.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_950'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

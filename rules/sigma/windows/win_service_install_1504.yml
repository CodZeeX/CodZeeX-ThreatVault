title: Detect Suspicious Windows Service Installation - Variant 1504
id: d1c5f066b284e75bf717104e5a310e21
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-20
tags:
    - attack.defense_evasion
    - attack.t1704
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1504.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1504'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

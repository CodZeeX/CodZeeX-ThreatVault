title: Detect Suspicious Windows Ps Script - Variant 1870
id: 88e902f44d2ecfe593f668a13ba29d77
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-12
tags:
    - attack.exfiltration
    - attack.t1270
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1870.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1870'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

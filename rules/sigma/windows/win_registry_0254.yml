title: Detect Suspicious Windows Registry Event - Variant 254
id: 754386ed7dc3faccf0138e7f03a46fd7
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.persistence
    - attack.t1254
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_254.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_254'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

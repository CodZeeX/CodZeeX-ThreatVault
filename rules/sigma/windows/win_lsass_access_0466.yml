title: Detect Suspicious Windows Process Access - Variant 466
id: b5a6080ddf911b92564f3c92addfbf37
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-13
tags:
    - attack.exfiltration
    - attack.t1466
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_466.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_466'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

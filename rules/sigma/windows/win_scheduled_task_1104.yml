title: Detect Suspicious Windows Scheduled Task Creation - Variant 1104
id: 2f2d38b690841948edf64a579e83331e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.initial_access
    - attack.t1304
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1104.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1104'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1722
id: 0b3ea9d70ea29e115cbe0f31762bd5a6
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-02
tags:
    - attack.discovery
    - attack.t1122
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1722.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1722'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 284
id: 9e1e324148eb908d1733adea7266f58e
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-31
tags:
    - attack.collection
    - attack.t1284
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_284.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_284'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

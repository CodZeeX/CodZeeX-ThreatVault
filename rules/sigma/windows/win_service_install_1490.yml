title: Detect Suspicious Windows Service Installation - Variant 1490
id: eb9dbecb97c86aa3328b0ef7d2c0a96d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.persistence
    - attack.t1690
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1490.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1490'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

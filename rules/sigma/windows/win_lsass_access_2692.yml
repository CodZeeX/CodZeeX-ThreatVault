title: Detect Suspicious Windows Process Access - Variant 2692
id: f09927b17e19a17d7b0dd5f9fd264d42
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-02
tags:
    - attack.defense_evasion
    - attack.t1292
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2692.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2692'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

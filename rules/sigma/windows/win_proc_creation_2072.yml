title: Detect Suspicious Windows Process Creation - Variant 2072
id: 73df6c382ddf0ce36f710b441c2cbc82
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.collection
    - attack.t1472
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2072.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2072'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

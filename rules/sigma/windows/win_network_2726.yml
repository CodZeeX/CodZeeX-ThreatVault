title: Detect Suspicious Windows Network Connection - Variant 2726
id: 6cd74f47146b29cba02efcb453583704
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.persistence
    - attack.t1326
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2726.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2726'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

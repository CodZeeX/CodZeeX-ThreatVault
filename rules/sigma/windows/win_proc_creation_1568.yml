title: Detect Suspicious Windows Process Creation - Variant 1568
id: 33ce219b740eba0adff965496686960e
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.collection
    - attack.t1768
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1568.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1568'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

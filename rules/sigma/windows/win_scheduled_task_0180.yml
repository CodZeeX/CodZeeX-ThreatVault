title: Detect Suspicious Windows Scheduled Task Creation - Variant 180
id: 0ae9944ccc1871d02409ed532b075a7a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-25
tags:
    - attack.initial_access
    - attack.t1180
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_180.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_180'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

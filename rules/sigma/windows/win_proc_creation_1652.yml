title: Detect Suspicious Windows Process Creation - Variant 1652
id: b935110f3fbb60cfbcbc7f4c05a1d9d4
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.collection
    - attack.t1052
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1652.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1652'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

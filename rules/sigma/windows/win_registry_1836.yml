title: Detect Suspicious Windows Registry Event - Variant 1836
id: 3a9e98e50a86f4026bfff6a0101d4976
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-09
tags:
    - attack.initial_access
    - attack.t1236
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1836.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1836'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

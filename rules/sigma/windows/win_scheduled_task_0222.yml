title: Detect Suspicious Windows Scheduled Task Creation - Variant 222
id: 065ce4fa5bc11ce2848ebca7d36bd561
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.discovery
    - attack.t1222
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_222.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_222'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

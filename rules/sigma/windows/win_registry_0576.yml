title: Detect Suspicious Windows Registry Event - Variant 576
id: 85093dba2650c31e931f72b0bbf81fe0
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-20
tags:
    - attack.initial_access
    - attack.t1576
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_576.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_576'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1446
id: 47e64cba6727d7651b11c60a78890f0c
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.discovery
    - attack.t1646
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1446.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1446'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

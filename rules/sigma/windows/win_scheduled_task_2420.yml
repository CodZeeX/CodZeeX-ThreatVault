title: Detect Suspicious Windows Scheduled Task Creation - Variant 2420
id: 6ded299ce18e0bb7d1ec52b7bba6ded6
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-13
tags:
    - attack.collection
    - attack.t1020
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2420.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2420'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

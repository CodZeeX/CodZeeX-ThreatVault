title: Detect Suspicious Windows Network Connection - Variant 262
id: 7763ccb33725cb292404705f18ebd315
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.exfiltration
    - attack.t1262
logsource:
    category: network_connection

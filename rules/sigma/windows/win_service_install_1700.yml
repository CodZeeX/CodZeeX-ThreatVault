title: Detect Suspicious Windows Service Installation - Variant 1700
id: 965d27376731bf4cfb397e90666827e8
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.collection
    - attack.t1100
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1700.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1700'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1530
id: 8d1e242bb8d06992dcfcf24a14eec41b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-22
tags:
    - attack.discovery
    - attack.t1730
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1530.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1530'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2598
id: f7d316747780afa5a26a068aab343071
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-25
tags:
    - attack.discovery
    - attack.t1198
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2598.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2598'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

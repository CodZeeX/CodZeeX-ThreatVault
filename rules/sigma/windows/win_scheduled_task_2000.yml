title: Detect Suspicious Windows Scheduled Task Creation - Variant 2000
id: aa6679d70fd334da39ec1624f4b6d13c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-20
tags:
    - attack.collection
    - attack.t1400
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2000.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2000'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

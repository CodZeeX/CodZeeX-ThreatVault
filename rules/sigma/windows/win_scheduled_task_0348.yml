title: Detect Suspicious Windows Scheduled Task Creation - Variant 348
id: 257484eff2a00ac1d6254f4ec8652280
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-05
tags:
    - attack.initial_access
    - attack.t1348
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_348.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_348'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

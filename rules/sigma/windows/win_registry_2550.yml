title: Detect Suspicious Windows Registry Event - Variant 2550
id: 3b0302a2ad9830f715d2ad31e987fb6c
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-23
tags:
    - attack.discovery
    - attack.t1150
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2550.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2550'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

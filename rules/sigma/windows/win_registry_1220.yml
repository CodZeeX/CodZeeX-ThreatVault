title: Detect Suspicious Windows Registry Event - Variant 1220
id: e4105522956252decc243dc96c98e1a3
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.collection
    - attack.t1420
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1220.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1220'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 462
id: d6da38e6de84993efbfe5de5a8c75534
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-13
tags:
    - attack.discovery
    - attack.t1462
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_462.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_462'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 560
id: 4ba5feac3bdadfce69ac324da32643da
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-19
tags:
    - attack.collection
    - attack.t1560
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_560.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_560'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

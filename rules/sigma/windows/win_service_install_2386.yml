title: Detect Suspicious Windows Service Installation - Variant 2386
id: f89af27cc03f5492adb3c0f751e276a4
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.exfiltration
    - attack.t1786
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2386.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2386'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

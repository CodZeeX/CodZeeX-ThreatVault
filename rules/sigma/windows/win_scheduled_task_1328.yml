title: Detect Suspicious Windows Scheduled Task Creation - Variant 1328
id: aa6e72e2cd419651f60d402bcec73c86
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.collection
    - attack.t1528
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1328.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1328'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

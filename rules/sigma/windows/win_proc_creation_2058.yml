title: Detect Suspicious Windows Process Creation - Variant 2058
id: 92b8c7d2b762f33ecbff6b924423b7d1
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-23
tags:
    - attack.discovery
    - attack.t1458
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2058.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2058'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 1696
id: 36e8cc86ad9638b55c204f6878c54cd1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.defense_evasion
    - attack.t1096
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1696.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1696'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

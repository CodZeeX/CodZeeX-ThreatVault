title: Detect Suspicious Windows Process Creation - Variant 1078
id: de2efb822c1e23afc1327a2af14a3c35
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-26
tags:
    - attack.exfiltration
    - attack.t1278
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1078.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1078'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

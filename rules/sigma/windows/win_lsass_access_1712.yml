title: Detect Suspicious Windows Process Access - Variant 1712
id: 452675f8b0651cf1dab2d34ce31a6c54
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-02
tags:
    - attack.collection
    - attack.t1112
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1712.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1712'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1098
id: ee16a5e3cef945d8c785068f7d72a664
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-27
tags:
    - attack.discovery
    - attack.t1298
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1098.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1098'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

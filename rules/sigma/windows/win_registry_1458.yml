title: Detect Suspicious Windows Registry Event - Variant 1458
id: d52a5ac135df06727c02bada04b726c8
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.discovery
    - attack.t1658
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1458.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1458'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

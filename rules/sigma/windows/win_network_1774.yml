title: Detect Suspicious Windows Network Connection - Variant 1774
id: d4c718f3f6e983f1fb1b563add411492
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.exfiltration
    - attack.t1174
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1774.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1774'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

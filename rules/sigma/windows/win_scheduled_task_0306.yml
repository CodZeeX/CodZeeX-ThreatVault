title: Detect Suspicious Windows Scheduled Task Creation - Variant 306
id: 9152460e21839e7f23cfaa374ce3fd3e
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-02
tags:
    - attack.discovery
    - attack.t1306
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_306.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_306'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

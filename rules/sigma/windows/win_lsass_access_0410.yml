title: Detect Suspicious Windows Process Access - Variant 410
id: 88ea5cc1545b97702bef1fa82d31646d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-10
tags:
    - attack.persistence
    - attack.t1410
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_410.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_410'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1342
id: 6755976d568787acbdd829d08adc472e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-11
tags:
    - attack.exfiltration
    - attack.t1542
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1342.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1342'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 1606
id: e9e4800ce1f0e987fa90358fb3856050
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-26
tags:
    - attack.exfiltration
    - attack.t1006
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1606.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1606'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

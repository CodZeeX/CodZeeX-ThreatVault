title: Detect Suspicious Windows Ps Script - Variant 260
id: a181e7105e9b1c59bb607cf8414aedd1
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.collection
    - attack.t1260
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_260.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_260'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

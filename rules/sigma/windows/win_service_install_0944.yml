title: Detect Suspicious Windows Service Installation - Variant 944
id: 17d847007f7f329a8f7c071397687649
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-18
tags:
    - attack.collection
    - attack.t1144
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_944.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_944'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

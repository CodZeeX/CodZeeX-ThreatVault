title: Detect Suspicious Windows Ps Script - Variant 78
id: 85f0cb77e65a99d7ae7be5c35ca4d3fa
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-18
tags:
    - attack.discovery
    - attack.t1078
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_78.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_78'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

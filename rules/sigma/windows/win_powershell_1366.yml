title: Detect Suspicious Windows Ps Script - Variant 1366
id: f65fbe88940e33557676b5b9937491ac
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-12
tags:
    - attack.exfiltration
    - attack.t1566
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1366.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1366'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

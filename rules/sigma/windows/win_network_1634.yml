title: Detect Suspicious Windows Network Connection - Variant 1634
id: e0d819268a517636811cb5d84769fe5e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.persistence
    - attack.t1034
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1634.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1634'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

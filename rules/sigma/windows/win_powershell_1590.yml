title: Detect Suspicious Windows Ps Script - Variant 1590
id: b314bf42755ac23eb10c007f72f6cbe2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.discovery
    - attack.t1790
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1590.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1590'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

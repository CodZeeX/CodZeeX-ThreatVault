title: Detect Suspicious Windows Registry Event - Variant 436
id: 440066187778af3cfef3f0794097a38c
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.defense_evasion
    - attack.t1436
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_436.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_436'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

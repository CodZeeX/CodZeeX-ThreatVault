title: Detect Suspicious Windows Process Access - Variant 1376
id: c375259cafd9cd9c30e812cdd900ebe2
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-13
tags:
    - attack.collection
    - attack.t1576
logsource:
    category: process_access
    product: windows
detection:

title: Detect Suspicious Windows Network Connection - Variant 318
id: 4467445f57ca315b0cb900f2b8343ca8
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-03
tags:
    - attack.discovery
    - attack.t1318
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_318.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_318'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 496
id: 40d8ecb014a0ddf58483366142b79fe5
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.defense_evasion
    - attack.t1496
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_496.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_496'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

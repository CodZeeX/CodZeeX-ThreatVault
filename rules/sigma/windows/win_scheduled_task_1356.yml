title: Detect Suspicious Windows Scheduled Task Creation - Variant 1356
id: 507febf84240b2ac06dde7be8a723306
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-11
tags:
    - attack.initial_access
    - attack.t1556
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1356.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1356'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

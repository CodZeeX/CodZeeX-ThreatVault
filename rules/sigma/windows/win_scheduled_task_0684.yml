title: Detect Suspicious Windows Scheduled Task Creation - Variant 684
id: d4aafe5d5fe2687f30f61becc7793af1
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-27
tags:
    - attack.initial_access
    - attack.t1684
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_684.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_684'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

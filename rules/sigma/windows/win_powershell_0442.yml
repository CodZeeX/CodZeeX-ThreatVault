title: Detect Suspicious Windows Ps Script - Variant 442
id: 996ea0becaf184c1247350d9c94be048
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.exfiltration
    - attack.t1442
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_442.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_442'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

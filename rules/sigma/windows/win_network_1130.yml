title: Detect Suspicious Windows Network Connection - Variant 1130
id: b4fecd3779e7e439c3ebc21450c57ed4
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-29
tags:
    - attack.persistence
    - attack.t1330
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1130.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1130'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 266
id: dcacbdb51bf24289705915cf2e2fe0b7
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.persistence
    - attack.t1266
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_266.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_266'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 18
id: 1fe41536615d22090d817d5052a63f9b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-14
tags:
    - attack.discovery
    - attack.t1018
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_18.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_18'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

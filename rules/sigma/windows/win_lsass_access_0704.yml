title: Detect Suspicious Windows Process Access - Variant 704
id: 3eb39cb1419eb1d5f3786c9601c26aec
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.collection
    - attack.t1704
logsource:
    category: process_access
    product: windows
detection:

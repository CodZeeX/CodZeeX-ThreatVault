title: Detect Suspicious Windows Network Connection - Variant 850
id: 940fa0fdd36d7e20a76b39c532618af9
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.exfiltration
    - attack.t1050
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_850.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_850'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

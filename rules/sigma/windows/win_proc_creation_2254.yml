title: Detect Suspicious Windows Process Creation - Variant 2254
id: 6bba8055073aafbebbf48ab09b05848d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-04
tags:
    - attack.exfiltration
    - attack.t1654
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2254.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2254'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

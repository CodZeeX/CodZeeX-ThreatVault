title: Detect Suspicious Windows Network Connection - Variant 1270
id: eccbbbd92df42ede0364129151d8fdcd
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-06
tags:
    - attack.exfiltration
    - attack.t1470
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1270.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1270'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 8
id: 5b55befce5a523c82f04056fb9e68aa1
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-14
tags:
    - attack.collection
    - attack.t1008
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_8.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_8'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 2456
id: 2b560a1fc4c8d633d3c8162fa1fcf583
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.collection
    - attack.t1056
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2456.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2456'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

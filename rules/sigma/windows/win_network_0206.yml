title: Detect Suspicious Windows Network Connection - Variant 206
id: 784b53c42fb47d900d080229eed25936
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.persistence
    - attack.t1206
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_206.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_206'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

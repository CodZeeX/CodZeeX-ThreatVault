title: Detect Suspicious Windows Network Connection - Variant 1900
id: e425a3dd26421e2393876fa69ead71cd
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.defense_evasion
    - attack.t1300
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1900.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1900'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

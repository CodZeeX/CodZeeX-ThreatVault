title: Detect Suspicious Windows Process Access - Variant 606
id: a823016fda625aecf3ea4802c5772926
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-22
tags:
    - attack.discovery
    - attack.t1606
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_606.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_606'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

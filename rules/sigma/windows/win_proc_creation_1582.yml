title: Detect Suspicious Windows Process Creation - Variant 1582
id: e36957e065cd2c087296cdda8968992a
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.exfiltration
    - attack.t1782
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1582.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1582'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

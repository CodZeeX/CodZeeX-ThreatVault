title: Detect Suspicious Windows Process Creation - Variant 1512
id: 6fec17a09681f53ccb50719f483af0f4
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-21
tags:
    - attack.initial_access
    - attack.t1712
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1512.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1512'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1106
id: 58b443543c2b00588b665fb33a08ebf5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.persistence
    - attack.t1306
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1106.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1106'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

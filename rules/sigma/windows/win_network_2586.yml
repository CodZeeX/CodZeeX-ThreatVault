title: Detect Suspicious Windows Network Connection - Variant 2586
id: d6cddbb7caf90972f530b6cbf997f5cf
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.discovery
    - attack.t1186
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2586.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2586'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

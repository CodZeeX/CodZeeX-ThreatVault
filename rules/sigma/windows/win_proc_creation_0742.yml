title: Detect Suspicious Windows Process Creation - Variant 742
id: bee2b248cc55f9d5fb8088bd3a1e4c24
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.exfiltration
    - attack.t1742
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_742.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_742'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

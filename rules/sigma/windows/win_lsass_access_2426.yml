title: Detect Suspicious Windows Process Access - Variant 2426
id: 7954adb75b7afeca1bba2d00924ed634
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-14
tags:
    - attack.persistence
    - attack.t1026
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2426.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2426'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

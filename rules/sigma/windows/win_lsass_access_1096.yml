title: Detect Suspicious Windows Process Access - Variant 1096
id: a0e8480256d08b4cbdb6e68eb4f368b5
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-27
tags:
    - attack.defense_evasion
    - attack.t1296
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1096.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1096'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1310
id: 1550d3dbc7133a5b60bd90c6c1bc7b1b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-09
tags:
    - attack.persistence
    - attack.t1510
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1310.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1310'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

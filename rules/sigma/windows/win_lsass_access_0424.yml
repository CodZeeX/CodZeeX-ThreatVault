title: Detect Suspicious Windows Process Access - Variant 424
id: 5c46f6258e3c2a37b2b66bb379474fd0
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-10
tags:
    - attack.defense_evasion
    - attack.t1424
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_424.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_424'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

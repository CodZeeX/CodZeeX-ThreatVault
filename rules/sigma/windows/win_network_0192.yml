title: Detect Suspicious Windows Network Connection - Variant 192
id: f4341652ba37921490cd2c7091cfa6ae
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-26
tags:
    - attack.initial_access
    - attack.t1192
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_192.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_192'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2542
id: 98985a330e0b23038f1a146de682dd18
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-22
tags:
    - attack.exfiltration
    - attack.t1142
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2542.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2542'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

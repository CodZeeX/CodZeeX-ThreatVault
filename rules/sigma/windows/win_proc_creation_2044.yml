title: Detect Suspicious Windows Process Creation - Variant 2044
id: 1f0f4eb26f2dc959ba2df31dc247ba96
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.defense_evasion
    - attack.t1444
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2044.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2044'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

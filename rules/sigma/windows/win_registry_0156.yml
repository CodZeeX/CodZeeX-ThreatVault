title: Detect Suspicious Windows Registry Event - Variant 156
id: 677496ff5bf15fdf78402e626b8e1917
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-23
tags:
    - attack.initial_access
    - attack.t1156
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_156.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_156'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

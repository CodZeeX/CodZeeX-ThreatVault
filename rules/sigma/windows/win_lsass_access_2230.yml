title: Detect Suspicious Windows Process Access - Variant 2230
id: a9919b1268226cbd5c8a0246fc0107be
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-02
tags:
    - attack.exfiltration
    - attack.t1630
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2230.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2230'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

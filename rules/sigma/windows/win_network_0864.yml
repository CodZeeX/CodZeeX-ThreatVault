title: Detect Suspicious Windows Network Connection - Variant 864
id: 2ac3ef2d43a25f96ac191e6a001c1dd3
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-12
tags:
    - attack.initial_access
    - attack.t1064
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_864.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_864'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

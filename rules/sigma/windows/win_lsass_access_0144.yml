title: Detect Suspicious Windows Process Access - Variant 144
id: d58bd1d338ee72d39d3f5a500c4ad4f0
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-23
tags:
    - attack.initial_access
    - attack.t1144
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_144.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_144'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

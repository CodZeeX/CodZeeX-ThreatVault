title: Detect Suspicious Windows Registry Event - Variant 898
id: cc78876114e9f1fd304baad246598860
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-14
tags:
    - attack.exfiltration
    - attack.t1098
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_898.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_898'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

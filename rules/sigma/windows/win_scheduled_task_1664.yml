title: Detect Suspicious Windows Scheduled Task Creation - Variant 1664
id: b69533b300c325dbcbc2f5a548310a42
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.collection
    - attack.t1064
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1664.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1664'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

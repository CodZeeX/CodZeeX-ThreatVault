title: Detect Suspicious Windows Process Access - Variant 1670
id: 2a5b77a0369c1256856108a12f6e1a9b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.persistence
    - attack.t1070
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1670.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1670'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

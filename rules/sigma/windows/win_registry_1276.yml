title: Detect Suspicious Windows Registry Event - Variant 1276
id: baf885c55c5d3c364123f10bb59a413b
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-07
tags:
    - attack.defense_evasion
    - attack.t1476
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1276.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1276'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 50
id: bb038fc445e3ecdc5610c25944565149
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-16
tags:
    - attack.persistence
    - attack.t1050
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_50.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_50'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

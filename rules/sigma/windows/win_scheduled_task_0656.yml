title: Detect Suspicious Windows Scheduled Task Creation - Variant 656
id: 06c6eee0b6c274ee6ce28064d937daac
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.collection
    - attack.t1656
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_656.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_656'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

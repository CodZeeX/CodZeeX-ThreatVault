title: Detect Suspicious Windows Ps Script - Variant 2416
id: ebfaff4ee2e76f933b210304eb53ba0e
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-13
tags:
    - attack.defense_evasion
    - attack.t1016
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2416.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2416'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

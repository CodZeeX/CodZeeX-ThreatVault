title: Detect Suspicious Windows Service Installation - Variant 2288
id: 793ef8d5db6856dffdb688848066a505
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.collection
    - attack.t1688
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2288.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2288'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

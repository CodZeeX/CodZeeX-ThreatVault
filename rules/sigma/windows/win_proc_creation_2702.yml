title: Detect Suspicious Windows Process Creation - Variant 2702
id: c221c341ea2f323daa936787e03ebf57
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-02
tags:
    - attack.persistence
    - attack.t1302
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2702.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2702'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 708
id: c3b030e5f116f4a599476acc8bdf25c9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.initial_access
    - attack.t1708
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_708.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_708'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

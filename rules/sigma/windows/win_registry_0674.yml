title: Detect Suspicious Windows Registry Event - Variant 674
id: 8432fa7cd43a97a54649e5b7e824143b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-26
tags:
    - attack.persistence
    - attack.t1674
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_674.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_674'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

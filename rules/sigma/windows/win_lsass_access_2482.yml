title: Detect Suspicious Windows Process Access - Variant 2482
id: 0d5b16be6f256fad2920c992dc24df40
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-18
tags:
    - attack.exfiltration
    - attack.t1082
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2482.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2482'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

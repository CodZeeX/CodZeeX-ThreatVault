title: Detect Suspicious Windows Network Connection - Variant 2768
id: 12c8fb36090818e38c8a8915bb3c5628
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-06
tags:
    - attack.collection
    - attack.t1368
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2768.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2768'
    condition: selection
falsepositives:

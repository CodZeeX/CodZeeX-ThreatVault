title: Detect Suspicious Windows Scheduled Task Creation - Variant 2434
id: 3c2ac1e7baf056026b62402cf4d90c47
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-15
tags:
    - attack.exfiltration
    - attack.t1034
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2434.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2434'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

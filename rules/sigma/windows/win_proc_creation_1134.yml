title: Detect Suspicious Windows Process Creation - Variant 1134
id: f265e61bb0d6c371ba5470a6eb6d946b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-29
tags:
    - attack.discovery
    - attack.t1334
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1134.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1134'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 868
id: 54c7d2deaf01db7b34d05b4b31f7f7e8
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-12
tags:
    - attack.defense_evasion
    - attack.t1068
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_868.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_868'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

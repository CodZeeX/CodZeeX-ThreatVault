title: Detect Suspicious Windows Process Creation - Variant 2576
id: e1fb7d807cc4de7076988490bb7d349e
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.collection
    - attack.t1176
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2576.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2576'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

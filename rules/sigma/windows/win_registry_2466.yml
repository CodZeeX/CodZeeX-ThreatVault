title: Detect Suspicious Windows Registry Event - Variant 2466
id: 3f40ac5441c0630aef97c66c1df7ba07
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-17
tags:
    - attack.discovery
    - attack.t1066
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2466.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2466'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

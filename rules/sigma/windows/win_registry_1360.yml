title: Detect Suspicious Windows Registry Event - Variant 1360
id: dbdec4f4e6ed803cf249632185b606ef
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-12
tags:
    - attack.defense_evasion
    - attack.t1560
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1360.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1360'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

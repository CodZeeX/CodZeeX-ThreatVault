title: Detect Suspicious Windows Registry Event - Variant 548
id: 693da5254a313e2ed3b2ed9ce4851a9a
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-18
tags:
    - attack.collection
    - attack.t1548
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_548.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_548'
    condition: selection
falsepositives:

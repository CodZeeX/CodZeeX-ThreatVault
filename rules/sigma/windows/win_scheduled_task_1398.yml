title: Detect Suspicious Windows Scheduled Task Creation - Variant 1398
id: eaabb04c663263dc4cb92eefbb53e530
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.discovery
    - attack.t1598
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1398.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1398'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

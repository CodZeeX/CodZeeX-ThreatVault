title: Detect Suspicious Windows Service Installation - Variant 790
id: 014560fbb6fd1343fbc8a07b0cf1af9d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-06
tags:
    - attack.exfiltration
    - attack.t1790
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_790.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_790'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

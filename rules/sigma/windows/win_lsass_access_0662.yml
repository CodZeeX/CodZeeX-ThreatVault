title: Detect Suspicious Windows Process Access - Variant 662
id: c077b29133e961341190ef3a94596e67
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.persistence
    - attack.t1662
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_662.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_662'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

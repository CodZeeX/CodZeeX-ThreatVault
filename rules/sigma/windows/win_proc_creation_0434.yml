title: Detect Suspicious Windows Process Creation - Variant 434
id: 12368e294ba6411f61daba0157ac74fe
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.persistence
    - attack.t1434
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_434.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_434'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 518
id: 062ac901f4b98923700339bc63e4b6da
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-16
tags:
    - attack.persistence
    - attack.t1518
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_518.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_518'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

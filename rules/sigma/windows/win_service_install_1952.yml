title: Detect Suspicious Windows Service Installation - Variant 1952
id: 815f9c8ae2fc3d540edb221842b81fc9
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.collection
    - attack.t1352
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1952.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1952'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

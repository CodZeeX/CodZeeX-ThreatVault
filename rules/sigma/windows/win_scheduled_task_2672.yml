title: Detect Suspicious Windows Scheduled Task Creation - Variant 2672
id: 62f7b77d02a4f52003751c7234d37624
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.collection
    - attack.t1272
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2672.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2672'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

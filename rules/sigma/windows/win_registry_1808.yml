title: Detect Suspicious Windows Registry Event - Variant 1808
id: af3cc06b7aa41fc060f39f96a428887c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-07
tags:
    - attack.collection
    - attack.t1208
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1808.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1808'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

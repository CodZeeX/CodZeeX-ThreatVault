title: Detect Suspicious Windows Network Connection - Variant 1340
id: 7221115f96bde5783145790011ca3f5a
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.collection
    - attack.t1540
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1340.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1340'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

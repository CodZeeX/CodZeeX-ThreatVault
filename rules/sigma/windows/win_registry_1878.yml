title: Detect Suspicious Windows Registry Event - Variant 1878
id: 1432702e614a1bd3891de16105853fd3
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-12
tags:
    - attack.discovery
    - attack.t1278
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1878.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1878'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1866
id: 14df16f283db40ef4630653a624d91a5
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-11
tags:
    - attack.discovery
    - attack.t1266
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1866.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1866'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

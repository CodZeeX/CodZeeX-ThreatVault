title: Detect Suspicious Windows Ps Script - Variant 1282
id: 490da0197cc20e7a54857fae80a5bffe
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-07
tags:
    - attack.exfiltration
    - attack.t1482
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1282.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1282'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

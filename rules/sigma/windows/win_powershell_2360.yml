title: Detect Suspicious Windows Ps Script - Variant 2360
id: abe31314e5df92309c4c137f0455f049
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.collection
    - attack.t1760
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2360.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2360'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

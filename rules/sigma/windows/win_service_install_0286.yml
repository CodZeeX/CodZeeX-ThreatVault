title: Detect Suspicious Windows Service Installation - Variant 286
id: 7c0354123a1974ee0065a25f588a830c
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-31
tags:
    - attack.exfiltration
    - attack.t1286
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_286.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_286'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

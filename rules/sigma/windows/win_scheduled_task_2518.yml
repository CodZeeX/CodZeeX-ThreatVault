title: Detect Suspicious Windows Scheduled Task Creation - Variant 2518
id: 756c646c8439d385f4fa9af405f0a0ea
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-20
tags:
    - attack.exfiltration
    - attack.t1118
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2518.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2518'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

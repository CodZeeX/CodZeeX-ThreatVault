title: Detect Suspicious Windows Service Installation - Variant 874
id: 6db583ba833d1cef210cbf94cf79688e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-13
tags:
    - attack.exfiltration
    - attack.t1074
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_874.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_874'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

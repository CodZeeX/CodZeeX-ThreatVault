title: Detect Suspicious Windows Scheduled Task Creation - Variant 2238
id: d97e43a72be131634f587d9a96075164
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.discovery
    - attack.t1638
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2238.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2238'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1406
id: fc4e3b6f4197bb7f4801fc88685262de
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.persistence
    - attack.t1606
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1406.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1406'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2728
id: 0f270bfd2654f2e215526ef08a303aee
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.defense_evasion
    - attack.t1328
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2728.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2728'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1344
id: 671de5cbaeb277c353b2b24526d3a098
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-11
tags:
    - attack.initial_access
    - attack.t1544
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1344.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1344'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

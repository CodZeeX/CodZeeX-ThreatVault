title: Detect Suspicious Windows Scheduled Task Creation - Variant 320
id: 7541af6c06b39f77fee5ae147c9ef13f
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-03
tags:
    - attack.collection
    - attack.t1320
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_320.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_320'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 138
id: 3dd62d0857c7dc4900ba752b9bc03532
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-22
tags:
    - attack.discovery
    - attack.t1138
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_138.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_138'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

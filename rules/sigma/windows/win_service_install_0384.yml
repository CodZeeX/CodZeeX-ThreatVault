title: Detect Suspicious Windows Service Installation - Variant 384
id: cff1af8ed6713710b9ff20743e477d15
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-07
tags:
    - attack.initial_access
    - attack.t1384
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_384.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_384'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

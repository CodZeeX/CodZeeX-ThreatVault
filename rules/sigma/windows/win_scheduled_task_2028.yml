title: Detect Suspicious Windows Scheduled Task Creation - Variant 2028
id: 8f7efaf0a4d604e83d9d5c8adbe37cfb
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.initial_access
    - attack.t1428
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2028.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2028'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

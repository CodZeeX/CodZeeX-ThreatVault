title: Detect Suspicious Windows Ps Script - Variant 302
id: 0c7d4855deb1f1813729c7e2f087d556
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-02
tags:
    - attack.persistence
    - attack.t1302
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_302.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_302'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2534
id: feec7ca358f71bac29aedd9ddd1f70f9
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-21
tags:
    - attack.persistence
    - attack.t1134
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2534.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2534'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

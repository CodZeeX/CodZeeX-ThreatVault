title: Detect Suspicious Windows Service Installation - Variant 1616
id: 58bf440ba501c940ede670cbb7c4ae67
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-26
tags:
    - attack.collection
    - attack.t1016
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1616.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1616'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

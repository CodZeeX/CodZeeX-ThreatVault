title: Detect Suspicious Windows Service Installation - Variant 1924
id: 42cdbaff9c311706d6c3f178841463fe
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-15
tags:
    - attack.defense_evasion
    - attack.t1324
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1924.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1924'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

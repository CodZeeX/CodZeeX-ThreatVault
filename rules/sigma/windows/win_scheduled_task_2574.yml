title: Detect Suspicious Windows Scheduled Task Creation - Variant 2574
id: 8e1bc60dcd186299ec049cac57d97d6e
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.discovery
    - attack.t1174
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2574.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2574'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

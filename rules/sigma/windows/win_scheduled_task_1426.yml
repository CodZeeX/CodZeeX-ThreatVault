title: Detect Suspicious Windows Scheduled Task Creation - Variant 1426
id: 5852e05f14307dc8ef6300647e0624d2
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-16
tags:
    - attack.exfiltration
    - attack.t1626
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1426.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1426'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

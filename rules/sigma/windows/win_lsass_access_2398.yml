title: Detect Suspicious Windows Process Access - Variant 2398
id: 13f30bbec1817e288596e0790746a234
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-12
tags:
    - attack.exfiltration
    - attack.t1798
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2398.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2398'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

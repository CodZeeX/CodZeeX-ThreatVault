title: Detect Suspicious Windows Scheduled Task Creation - Variant 768
id: 9aadcbd6257b9d980b43afb68c50ea66
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-05
tags:
    - attack.initial_access
    - attack.t1768
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_768.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_768'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

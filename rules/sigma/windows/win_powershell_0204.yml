title: Detect Suspicious Windows Ps Script - Variant 204
id: 65f217ee081e71833779b598e3c6ca20
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.initial_access
    - attack.t1204
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_204.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_204'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

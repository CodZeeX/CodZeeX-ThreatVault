title: Detect Suspicious Windows Network Connection - Variant 962
id: 3a41f4adf8c5b8ee8cf3e2e4c4ff4000
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-19
tags:
    - attack.persistence
    - attack.t1162
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_962.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_962'
    condition: selection
falsepositives:

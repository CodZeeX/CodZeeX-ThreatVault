title: Detect Suspicious Windows Registry Event - Variant 842
id: 3423979a1f2cd494d153a4d0fc1b999f
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.persistence
    - attack.t1042
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_842.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_842'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

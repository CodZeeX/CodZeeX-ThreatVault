title: Detect Suspicious Windows Registry Event - Variant 1444
id: 48aae71f73c40be06355b1cdfaa2f521
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.defense_evasion
    - attack.t1644
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1444.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1444'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

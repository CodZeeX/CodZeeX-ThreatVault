title: Detect Suspicious Windows Registry Event - Variant 1262
id: 475d6963cd90fc3d01ec3f3b41241daa
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-06
tags:
    - attack.persistence
    - attack.t1462
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1262.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1262'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

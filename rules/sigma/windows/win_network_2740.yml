title: Detect Suspicious Windows Network Connection - Variant 2740
id: 8f0ada6266b9d49f5a1275c0f2dfb52e
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.defense_evasion
    - attack.t1340
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2740.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2740'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

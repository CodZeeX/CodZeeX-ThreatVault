title: Detect Suspicious Windows Scheduled Task Creation - Variant 474
id: 4a6eea07dfeb32da5d51cfb23505727f
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-13
tags:
    - attack.discovery
    - attack.t1474
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_474.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_474'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

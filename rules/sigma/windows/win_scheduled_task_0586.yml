title: Detect Suspicious Windows Scheduled Task Creation - Variant 586
id: 781d67d2df3201c52ab5ef1afcaf6cbe
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-21
tags:
    - attack.exfiltration
    - attack.t1586
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_586.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_586'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 664
id: 597efb6b2be868e815e9c26c27022035
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.defense_evasion
    - attack.t1664
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_664.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_664'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

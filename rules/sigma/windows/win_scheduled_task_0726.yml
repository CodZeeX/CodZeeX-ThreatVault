title: Detect Suspicious Windows Scheduled Task Creation - Variant 726
id: 4caaafd88824225a211364525507ffed
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-02
tags:
    - attack.discovery
    - attack.t1726
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_726.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_726'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

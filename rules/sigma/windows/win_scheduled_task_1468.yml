title: Detect Suspicious Windows Scheduled Task Creation - Variant 1468
id: b0bc3b632c76b50a44e8edd16dff7b70
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-18
tags:
    - attack.defense_evasion
    - attack.t1668
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1468.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1468'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2536
id: e7bc9a51791a59ac400f06dc8141b434
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-21
tags:
    - attack.defense_evasion
    - attack.t1136
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2536.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2536'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

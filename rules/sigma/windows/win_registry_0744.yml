title: Detect Suspicious Windows Registry Event - Variant 744
id: b3b3415ae66894db691c58e4273ae679
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.initial_access
    - attack.t1744
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_744.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_744'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

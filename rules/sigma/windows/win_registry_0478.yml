title: Detect Suspicious Windows Registry Event - Variant 478
id: 19b2e4ac32a3094de933f32bf33ec7ff
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.exfiltration
    - attack.t1478
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_478.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_478'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

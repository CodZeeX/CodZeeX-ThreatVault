title: Detect Suspicious Windows Scheduled Task Creation - Variant 1090
id: 26b3f59bbce96cf92f916805b060beaa
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-27
tags:
    - attack.exfiltration
    - attack.t1290
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1090.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1090'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

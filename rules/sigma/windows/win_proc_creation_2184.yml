title: Detect Suspicious Windows Process Creation - Variant 2184
id: ec4ee98685974d82580da42672352bfa
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-30
tags:
    - attack.initial_access
    - attack.t1584
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2184.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2184'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

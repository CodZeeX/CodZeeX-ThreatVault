title: Detect Suspicious Windows Process Access - Variant 1614
id: 3ea949511b95ee3d469d8a1fbe2e419d
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-26
tags:
    - attack.discovery
    - attack.t1014
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1614.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1614'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

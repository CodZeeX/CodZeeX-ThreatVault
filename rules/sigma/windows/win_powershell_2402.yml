title: Detect Suspicious Windows Ps Script - Variant 2402
id: 6287de4f507bce57f25a0757b94484f7
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-12
tags:
    - attack.persistence
    - attack.t1002
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2402.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2402'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

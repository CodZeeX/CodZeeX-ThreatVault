title: Detect Suspicious Windows Scheduled Task Creation - Variant 810
id: c55aceb8bd5e6e675f9e8398f9a19ba6
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-08
tags:
    - attack.discovery
    - attack.t1010
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_810.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_810'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 104
id: db0a956d5c88e4c9fcf69c480daf21f0
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-20
tags:
    - attack.collection
    - attack.t1104
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_104.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_104'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

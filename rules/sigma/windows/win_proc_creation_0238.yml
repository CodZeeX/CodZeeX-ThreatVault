title: Detect Suspicious Windows Process Creation - Variant 238
id: cdca965447e845d17e16a8799aa5ea48
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-29
tags:
    - attack.exfiltration
    - attack.t1238
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_238.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_238'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

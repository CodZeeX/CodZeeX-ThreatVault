title: Detect Suspicious Windows Scheduled Task Creation - Variant 82
id: 2934809287f1a9d52317cc1faa2205b3
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-18
tags:
    - attack.exfiltration
    - attack.t1082
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_82.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_82'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

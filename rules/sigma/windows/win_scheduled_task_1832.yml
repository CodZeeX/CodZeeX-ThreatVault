title: Detect Suspicious Windows Scheduled Task Creation - Variant 1832
id: 5620fe16a090c25e2acf44cc7da380af
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-09
tags:
    - attack.collection
    - attack.t1232
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1832.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1832'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

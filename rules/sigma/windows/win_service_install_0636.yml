title: Detect Suspicious Windows Service Installation - Variant 636
id: 5340cfeaae4e0ce6232c1d27a5630f01
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-24
tags:
    - attack.initial_access
    - attack.t1636
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_636.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_636'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

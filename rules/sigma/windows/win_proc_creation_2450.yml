title: Detect Suspicious Windows Process Creation - Variant 2450
id: ef2a0dcf9a725b5793771f5410f913f3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.persistence
    - attack.t1050
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2450.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2450'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

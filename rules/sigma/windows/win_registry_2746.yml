title: Detect Suspicious Windows Registry Event - Variant 2746
id: 6f58a1fb17cb642a901e966bc665cb0b
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.exfiltration
    - attack.t1346
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2746.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2746'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

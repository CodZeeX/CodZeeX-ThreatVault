title: Detect Suspicious Windows Scheduled Task Creation - Variant 1776
id: ab76747252a6d0979d11d50471095c37
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.initial_access
    - attack.t1176
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1776.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1776'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

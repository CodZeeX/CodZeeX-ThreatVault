title: Detect Suspicious Windows Ps Script - Variant 330
id: d416a3ee10bed0bd9adc6c64a8cc241a
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-04
tags:
    - attack.discovery
    - attack.t1330
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_330.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_330'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

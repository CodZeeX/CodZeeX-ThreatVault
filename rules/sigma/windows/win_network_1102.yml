title: Detect Suspicious Windows Network Connection - Variant 1102
id: 16ff119cdde9059a0541076680c12ce6
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.exfiltration
    - attack.t1302
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1102.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1102'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 322
id: 6e3e818247a2d6b2663fed3a18ca5624
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-03
tags:
    - attack.exfiltration
    - attack.t1322
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_322.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_322'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 1816
id: 520f0041ccc140ea66a81374e2f6ff28
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-08
tags:
    - attack.defense_evasion
    - attack.t1216
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1816.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1816'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

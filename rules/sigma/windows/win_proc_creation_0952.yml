title: Detect Suspicious Windows Process Creation - Variant 952
id: 01ef02e37b8f5ec7cefa08dbc4085a85
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-18
tags:
    - attack.defense_evasion
    - attack.t1152
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_952.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_952'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1554
id: a29ee63e81e41f113955bb60ebdc1f24
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-23
tags:
    - attack.discovery
    - attack.t1754
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1554.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1554'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

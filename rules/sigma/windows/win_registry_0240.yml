title: Detect Suspicious Windows Registry Event - Variant 240
id: e1818d002238870dfee1d3bfaa561c51
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-29
tags:
    - attack.initial_access
    - attack.t1240
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_240.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_240'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1280
id: 364d5da91be814c520f9b166d4becc41
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-07
tags:
    - attack.collection
    - attack.t1480
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1280.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1280'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

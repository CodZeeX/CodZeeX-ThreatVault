title: Detect Suspicious Windows Ps Script - Variant 596
id: 98365ae7c33b16f355fd580194269675
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-21
tags:
    - attack.collection
    - attack.t1596
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_596.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_596'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 788
id: 9d0e7435bbcea73cefc0de208bf5b2de
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-06
tags:
    - attack.collection
    - attack.t1788
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_788.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_788'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2616
id: 4ed88de70777a93159e2fe26bcf05b16
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.initial_access
    - attack.t1216
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2616.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2616'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

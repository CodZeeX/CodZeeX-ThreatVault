title: Detect Suspicious Windows Ps Script - Variant 176
id: 79b7425ca9ce3b35bff9d03958749b5a
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.collection
    - attack.t1176
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_176.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_176'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

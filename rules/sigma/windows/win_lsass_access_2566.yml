title: Detect Suspicious Windows Process Access - Variant 2566
id: ed6be0ff9dc21493368d5aed2dde2087
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.exfiltration
    - attack.t1166
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2566.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2566'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

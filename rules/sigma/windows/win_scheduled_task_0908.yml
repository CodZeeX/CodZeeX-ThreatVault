title: Detect Suspicious Windows Scheduled Task Creation - Variant 908
id: b0015096160ed7e9917872013d4ce946
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-15
tags:
    - attack.collection
    - attack.t1108
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_908.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_908'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

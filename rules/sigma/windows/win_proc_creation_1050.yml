title: Detect Suspicious Windows Process Creation - Variant 1050
id: 5fedb0d1af5e4967b1a24452da06f44b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-24
tags:
    - attack.discovery
    - attack.t1250
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1050.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1050'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

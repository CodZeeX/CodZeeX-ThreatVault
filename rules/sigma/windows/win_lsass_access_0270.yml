title: Detect Suspicious Windows Process Access - Variant 270
id: ebfa02a2e69383601e12338d79f0eb5a
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.discovery
    - attack.t1270
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_270.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_270'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

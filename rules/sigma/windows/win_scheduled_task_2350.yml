title: Detect Suspicious Windows Scheduled Task Creation - Variant 2350
id: 17a3047e5c35c78d881728aa9fccc637
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-09
tags:
    - attack.exfiltration
    - attack.t1750
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2350.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2350'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

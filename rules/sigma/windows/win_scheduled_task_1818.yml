title: Detect Suspicious Windows Scheduled Task Creation - Variant 1818
id: 397836243d7bdd47d6436f61c9db7cb2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-08
tags:
    - attack.discovery
    - attack.t1218
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1818.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1818'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

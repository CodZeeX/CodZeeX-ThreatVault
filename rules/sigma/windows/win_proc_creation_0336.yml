title: Detect Suspicious Windows Process Creation - Variant 336
id: fb48470ae073300e25a332b83a3f8e16
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-04
tags:
    - attack.initial_access
    - attack.t1336
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_336.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_336'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

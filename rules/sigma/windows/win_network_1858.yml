title: Detect Suspicious Windows Network Connection - Variant 1858
id: 32e50c1097f49a38fdc0f8a1d31a996b
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-11
tags:
    - attack.exfiltration
    - attack.t1258
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1858.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1858'
    condition: selection
falsepositives:

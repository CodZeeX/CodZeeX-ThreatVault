title: Detect Suspicious Windows Process Access - Variant 1950
id: 198bf7fc6e2f7dc1e95ccb8ad3e07545
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.discovery
    - attack.t1350
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1950.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1950'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 444
id: f22e474447e8ecac34b61921382df991
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-12
tags:
    - attack.initial_access
    - attack.t1444
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_444.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_444'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

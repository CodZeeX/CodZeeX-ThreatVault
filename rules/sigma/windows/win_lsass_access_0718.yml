title: Detect Suspicious Windows Process Access - Variant 718
id: 1eefe6a766d00655e6a972e488616741
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-02
tags:
    - attack.exfiltration
    - attack.t1718
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_718.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_718'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

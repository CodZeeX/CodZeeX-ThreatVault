title: Detect Suspicious Windows Service Installation - Variant 1392
id: e96c36d8febc11b4249cfa3216e8db2a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.initial_access
    - attack.t1592
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1392.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1392'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 90
id: 05e1261a7b8f5733cedb1d25a53428ba
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-20
tags:
    - attack.discovery
    - attack.t1090
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_90.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_90'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

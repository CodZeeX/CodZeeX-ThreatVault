title: Detect Suspicious Windows Process Creation - Variant 56
id: e20a972079f7f9449181550cc98b7731
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-17
tags:
    - attack.collection
    - attack.t1056
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_56.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_56'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

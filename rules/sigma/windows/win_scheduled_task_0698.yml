title: Detect Suspicious Windows Scheduled Task Creation - Variant 698
id: d22ab77f41f4dd6582c755b965ddb252
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.persistence
    - attack.t1698
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_698.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_698'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 354
id: 5599d73be4027d5c8e02cca6ba9224c3
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-05
tags:
    - attack.discovery
    - attack.t1354
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_354.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_354'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1672
id: fc22e9f8b912d0a4f74f48905d21378e
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.defense_evasion
    - attack.t1072
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1672.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1672'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2686
id: ff2e17428c93092028ef964c887672b8
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.exfiltration
    - attack.t1286
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2686.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2686'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1988
id: 2e8c57d036bd930b9839547c576cbbcc
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-20
tags:
    - attack.collection
    - attack.t1388
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1988.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1988'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

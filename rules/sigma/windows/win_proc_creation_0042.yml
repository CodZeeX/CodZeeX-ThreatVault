title: Detect Suspicious Windows Process Creation - Variant 42
id: 910d82ce4876bde9f16d5c477f2978f6
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-16
tags:
    - attack.discovery
    - attack.t1042
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_42.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_42'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

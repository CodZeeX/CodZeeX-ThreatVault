title: Detect Suspicious Windows Scheduled Task Creation - Variant 2700
id: 077ab24ead6234a7933abc3ea17a3466
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-02
tags:
    - attack.initial_access
    - attack.t1300
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2700.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2700'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

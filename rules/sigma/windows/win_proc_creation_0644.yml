title: Detect Suspicious Windows Process Creation - Variant 644
id: a967d11ed40803b57b3b91c80bc104ff
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.collection
    - attack.t1644
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_644.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_644'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

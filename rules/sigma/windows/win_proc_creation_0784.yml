title: Detect Suspicious Windows Process Creation - Variant 784
id: f61d46655015a136254a2c7aa09bdc5d
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-06
tags:
    - attack.defense_evasion
    - attack.t1784
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_784.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_784'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 1704
id: 1136d82b86fa417f8e056846b6de30b8
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.initial_access
    - attack.t1104
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1704.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1704'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2308
id: 9b971eea09df24c9ac1e9c05248a033f
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.defense_evasion
    - attack.t1708
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2308.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2308'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

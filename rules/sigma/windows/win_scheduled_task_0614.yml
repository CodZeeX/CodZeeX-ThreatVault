title: Detect Suspicious Windows Scheduled Task Creation - Variant 614
id: 17cb7287d8de7891bd66799f8ae50416
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-23
tags:
    - attack.persistence
    - attack.t1614
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_614.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_614'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

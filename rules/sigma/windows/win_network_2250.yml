title: Detect Suspicious Windows Network Connection - Variant 2250
id: 923889c37727d0b947c4b9ac99afc814
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.discovery
    - attack.t1650
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2250.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2250'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

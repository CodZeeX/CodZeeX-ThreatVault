title: Detect Suspicious Windows Service Installation - Variant 1364
id: 3afe2b6e6e02869eab3401a30218195c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-12
tags:
    - attack.collection
    - attack.t1564
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1364.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1364'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

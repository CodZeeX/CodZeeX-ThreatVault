title: Detect Suspicious Windows Service Installation - Variant 216
id: 4d764d95b053b5a907e4606e031481da
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.initial_access
    - attack.t1216
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_216.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_216'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 900
id: ad62a27269b6c3c89dd9c7ae49eab33d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-14
tags:
    - attack.initial_access
    - attack.t1100
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_900.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_900'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

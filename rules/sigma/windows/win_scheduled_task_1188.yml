title: Detect Suspicious Windows Scheduled Task Creation - Variant 1188
id: e92d297178db8df57123dda88ee4d41b
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-02
tags:
    - attack.initial_access
    - attack.t1388
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1188.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1188'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

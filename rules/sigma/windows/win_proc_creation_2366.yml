title: Detect Suspicious Windows Process Creation - Variant 2366
id: c46b26eb19e1c02cfacf8ff7daab957b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.persistence
    - attack.t1766
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2366.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2366'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

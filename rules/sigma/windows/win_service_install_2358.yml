title: Detect Suspicious Windows Service Installation - Variant 2358
id: 78c368a2e42d43810d7361c0cfa07c34
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.discovery
    - attack.t1758
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2358.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2358'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

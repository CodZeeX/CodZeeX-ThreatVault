title: Detect Suspicious Windows Scheduled Task Creation - Variant 1734
id: 49405864f548d3a36bc616ae53cc1257
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-03
tags:
    - attack.discovery
    - attack.t1134
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1734.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1734'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

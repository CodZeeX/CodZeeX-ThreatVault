title: Detect Suspicious Windows Process Creation - Variant 854
id: 45b6c25550850f8a23406fd4c302d3c8
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.persistence
    - attack.t1054
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_854.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_854'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

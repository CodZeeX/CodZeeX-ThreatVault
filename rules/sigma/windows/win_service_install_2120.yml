title: Detect Suspicious Windows Service Installation - Variant 2120
id: dfa0bc18b33751343bbcc4f962392572
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-27
tags:
    - attack.collection
    - attack.t1520
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2120.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2120'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

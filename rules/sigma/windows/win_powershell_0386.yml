title: Detect Suspicious Windows Ps Script - Variant 386
id: 0705aec784bd2138e35785d0133361f9
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-07
tags:
    - attack.persistence
    - attack.t1386
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_386.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_386'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

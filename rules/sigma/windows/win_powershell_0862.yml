title: Detect Suspicious Windows Ps Script - Variant 862
id: 8fb2f78001d68af9d98cf2e178b2d326
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-12
tags:
    - attack.exfiltration
    - attack.t1062
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_862.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_862'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

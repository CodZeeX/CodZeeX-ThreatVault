title: Detect Suspicious Windows Registry Event - Variant 1556
id: 7e6741b1aa10e4612cb63bfac36d1f88
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-23
tags:
    - attack.collection
    - attack.t1756
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1556.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1556'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

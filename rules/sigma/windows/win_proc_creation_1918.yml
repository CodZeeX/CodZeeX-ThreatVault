title: Detect Suspicious Windows Process Creation - Variant 1918
id: 18316cce252a27fed63c5c6314b2278d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-15
tags:
    - attack.exfiltration
    - attack.t1318
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1918.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1918'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

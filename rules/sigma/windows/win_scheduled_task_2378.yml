title: Detect Suspicious Windows Scheduled Task Creation - Variant 2378
id: aaa3b4195ff6680f53a563f2bd340e0d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.persistence
    - attack.t1778
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2378.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2378'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

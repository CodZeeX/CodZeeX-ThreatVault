title: Detect Suspicious Windows Registry Event - Variant 800
id: 65662dabb03186453112cd39d81cfbe0
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-07
tags:
    - attack.collection
    - attack.t1000
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_800.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_800'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

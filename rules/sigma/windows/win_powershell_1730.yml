title: Detect Suspicious Windows Ps Script - Variant 1730
id: 7bf4eca9536e99508682dddb0f056df9
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-02
tags:
    - attack.persistence
    - attack.t1130
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1730.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1730'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

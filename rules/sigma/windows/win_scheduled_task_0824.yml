title: Detect Suspicious Windows Scheduled Task Creation - Variant 824
id: 0e1f7b9602737063beefb8bb793a1466
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.collection
    - attack.t1024
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_824.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_824'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

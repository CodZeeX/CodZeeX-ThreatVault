title: Detect Suspicious Windows Service Installation - Variant 1882
id: 663ec10d383b820ee024778d77c3b686
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-13
tags:
    - attack.exfiltration
    - attack.t1282
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1882.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1882'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

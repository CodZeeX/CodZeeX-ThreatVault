title: Detect Suspicious Windows Ps Script - Variant 1240
id: 917a87a80b46ea24c538c4275987a682
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.defense_evasion
    - attack.t1440
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1240.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1240'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

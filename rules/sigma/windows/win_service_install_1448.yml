title: Detect Suspicious Windows Service Installation - Variant 1448
id: 540ae19166de1497b901a60c6c34b4dc
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.collection
    - attack.t1648
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1448.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1448'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2156
id: 61112cb7b34e84c15feb13b326ee0c52
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-29
tags:
    - attack.collection
    - attack.t1556
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2156.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2156'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

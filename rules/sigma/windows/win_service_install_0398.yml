title: Detect Suspicious Windows Service Installation - Variant 398
id: 232b939e9d140cfc97388979632a88e3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-08
tags:
    - attack.persistence
    - attack.t1398
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_398.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_398'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

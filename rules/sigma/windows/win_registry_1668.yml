title: Detect Suspicious Windows Registry Event - Variant 1668
id: ee15fc182a660271b8a386326f8828b9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.initial_access
    - attack.t1068
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1668.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1668'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2010
id: f53d8c2245f19e6a48fce68f92876545
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.discovery
    - attack.t1410
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2010.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2010'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

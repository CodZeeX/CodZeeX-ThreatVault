title: Detect Suspicious Windows Process Creation - Variant 1036
id: 3b05a209fb194d849ef86cd1d18f48a0
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-23
tags:
    - attack.defense_evasion
    - attack.t1236
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1036.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1036'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

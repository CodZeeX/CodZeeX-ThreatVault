title: Detect Suspicious Windows Process Access - Variant 1250
id: 531a9c7712b3ca2ecbaf2f2c2a1bdb40
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-05
tags:
    - attack.persistence
    - attack.t1450
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1250.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1250'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

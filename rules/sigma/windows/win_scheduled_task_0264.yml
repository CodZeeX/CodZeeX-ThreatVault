title: Detect Suspicious Windows Scheduled Task Creation - Variant 264
id: 8a6fb4983e3974fecf39dd5820348a9a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.initial_access
    - attack.t1264
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_264.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_264'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

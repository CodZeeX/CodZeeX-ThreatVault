title: Detect Suspicious Windows Scheduled Task Creation - Variant 2560
id: ea09f4fb468b402e86fba12a3b5f5937
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-23
tags:
    - attack.defense_evasion
    - attack.t1160
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2560.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2560'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

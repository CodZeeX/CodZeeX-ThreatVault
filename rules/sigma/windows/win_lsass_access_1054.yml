title: Detect Suspicious Windows Process Access - Variant 1054
id: 1a93f04ab5067a2c3e2ce7f8c6b909df
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-25
tags:
    - attack.exfiltration
    - attack.t1254
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1054.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1054'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

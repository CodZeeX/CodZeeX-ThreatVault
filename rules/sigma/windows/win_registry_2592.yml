title: Detect Suspicious Windows Registry Event - Variant 2592
id: 04078f70e94814a345935dfb02964d34
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-25
tags:
    - attack.initial_access
    - attack.t1192
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2592.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2592'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 152
id: a720b0f9dc7f5be6c0953569121613cc
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-23
tags:
    - attack.collection
    - attack.t1152
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_152.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_152'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 600
id: ca64052c6a7bf59029fac1f9518240e7
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-22
tags:
    - attack.initial_access
    - attack.t1600
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_600.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_600'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1302
id: 5622cb734d16b26feddad8185093dd79
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-09
tags:
    - attack.discovery
    - attack.t1502
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1302.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1302'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

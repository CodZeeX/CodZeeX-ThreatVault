title: Detect Suspicious Windows Network Connection - Variant 80
id: 8422dbcf3db3dd099199059bf4955153
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-18
tags:
    - attack.collection
    - attack.t1080
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_80.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_80'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

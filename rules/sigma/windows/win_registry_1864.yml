title: Detect Suspicious Windows Registry Event - Variant 1864
id: ae032fa6154726c29304697edfd06dc4
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-11
tags:
    - attack.defense_evasion
    - attack.t1264
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1864.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1864'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

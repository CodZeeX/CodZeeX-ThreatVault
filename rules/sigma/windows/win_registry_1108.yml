title: Detect Suspicious Windows Registry Event - Variant 1108
id: 3eb95ca366311a1a05f00c78e20b85be
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.defense_evasion
    - attack.t1308
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1108.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1108'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

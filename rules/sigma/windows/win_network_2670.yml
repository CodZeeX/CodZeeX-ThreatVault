title: Detect Suspicious Windows Network Connection - Variant 2670
id: 62609a09b5037723d21965d83f0cba47
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-30
tags:
    - attack.discovery
    - attack.t1270
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2670.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2670'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

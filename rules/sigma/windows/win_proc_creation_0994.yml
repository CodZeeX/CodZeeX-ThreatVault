title: Detect Suspicious Windows Process Creation - Variant 994
id: c78981f2a2c4358714ca815df0f21ff6
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.exfiltration
    - attack.t1194
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_994.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_994'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

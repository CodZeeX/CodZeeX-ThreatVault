title: Detect Suspicious Windows Process Creation - Variant 1596
id: 32e069a41668514fd1c37f7489a0fade
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.initial_access
    - attack.t1796
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1596.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1596'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

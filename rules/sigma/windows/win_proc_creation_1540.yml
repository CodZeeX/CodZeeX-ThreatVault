title: Detect Suspicious Windows Process Creation - Variant 1540
id: 98be70fee209e3e206eb01475a7bd463
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-22
tags:
    - attack.defense_evasion
    - attack.t1740
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1540.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1540'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

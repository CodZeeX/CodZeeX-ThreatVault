title: Detect Suspicious Windows Process Access - Variant 1572
id: 702fb86844fd87a003134456674120ce
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.initial_access
    - attack.t1772
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1572.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1572'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1338
id: 80c3e44702d71657b906664ac4c9ae31
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.discovery
    - attack.t1538
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1338.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1338'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1002
id: f67bd27d527934ca1ab31b85444dac7b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.discovery
    - attack.t1202
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1002.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1002'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

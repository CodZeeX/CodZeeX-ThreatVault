title: Detect Suspicious Windows Ps Script - Variant 484
id: 38c55265fdb9a9616188f80419985da3
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.defense_evasion
    - attack.t1484
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_484.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_484'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1824
id: 2b4ac7365571f699b15e147be1738c6d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-08
tags:
    - attack.initial_access
    - attack.t1224
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1824.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1824'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

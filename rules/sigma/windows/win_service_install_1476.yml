title: Detect Suspicious Windows Service Installation - Variant 1476
id: 67f665135063918ac9d43e298b156bc9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-18
tags:
    - attack.initial_access
    - attack.t1676
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1476.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1476'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

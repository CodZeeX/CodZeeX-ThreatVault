title: Detect Suspicious Windows Scheduled Task Creation - Variant 334
id: 5bc568b0acc88e94c2ff049e08780e7d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-04
tags:
    - attack.exfiltration
    - attack.t1334
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_334.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_334'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

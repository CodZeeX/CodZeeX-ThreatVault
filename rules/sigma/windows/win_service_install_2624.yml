title: Detect Suspicious Windows Service Installation - Variant 2624
id: 639ccdf675100d4f3d0dea2ed8962448
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.collection
    - attack.t1224
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2624.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2624'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

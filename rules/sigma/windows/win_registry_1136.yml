title: Detect Suspicious Windows Registry Event - Variant 1136
id: e4e326ef5814809de3a4e8a67eee4d00
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-30
tags:
    - attack.collection
    - attack.t1336
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1136.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1136'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

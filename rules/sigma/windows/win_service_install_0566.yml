title: Detect Suspicious Windows Service Installation - Variant 566
id: 9cfaf8fb0c73777df2d735d66dff6c96
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-19
tags:
    - attack.persistence
    - attack.t1566
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_566.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_566'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

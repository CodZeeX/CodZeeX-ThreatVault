title: Detect Suspicious Windows Network Connection - Variant 1564
id: 22ac703bd764c94f7e6fcad61c34277d
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.defense_evasion
    - attack.t1764
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1564.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1564'
    condition: selection
falsepositives:

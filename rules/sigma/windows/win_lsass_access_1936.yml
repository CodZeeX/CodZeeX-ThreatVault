title: Detect Suspicious Windows Process Access - Variant 1936
id: ce8a834fda693bc03abb8409976a53d3
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.defense_evasion
    - attack.t1336
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1936.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1936'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

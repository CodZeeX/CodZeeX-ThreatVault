title: Detect Suspicious Windows Scheduled Task Creation - Variant 754
id: 618c4fe0863059be74f18ff839fee8ff
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-04
tags:
    - attack.exfiltration
    - attack.t1754
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_754.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_754'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

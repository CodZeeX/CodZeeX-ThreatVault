title: Detect Suspicious Windows Scheduled Task Creation - Variant 516
id: 6aeb0ee421bbdd8bc8d7ae2a373345a0
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-16
tags:
    - attack.initial_access
    - attack.t1516
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_516.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_516'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

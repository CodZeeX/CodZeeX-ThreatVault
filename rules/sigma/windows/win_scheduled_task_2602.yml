title: Detect Suspicious Windows Scheduled Task Creation - Variant 2602
id: 2d10df51ba6c91a72205dbcfeb51afe7
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-26
tags:
    - attack.exfiltration
    - attack.t1202
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2602.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2602'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

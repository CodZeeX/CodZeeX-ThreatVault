title: Detect Suspicious Windows Service Installation - Variant 1574
id: 4924dbd56a9227b8a4692f897b522121
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.persistence
    - attack.t1774
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1574.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1574'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

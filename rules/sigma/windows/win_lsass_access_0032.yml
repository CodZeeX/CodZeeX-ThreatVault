title: Detect Suspicious Windows Process Access - Variant 32
id: 59c4b4ade6d5d1ce51005126c70dfe93
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-15
tags:
    - attack.collection
    - attack.t1032
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_32.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_32'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1432
id: 4ae64fbe5ccabba708766ea7d0a337a8
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-16
tags:
    - attack.defense_evasion
    - attack.t1632
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1432.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1432'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

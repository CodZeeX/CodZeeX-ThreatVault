title: Detect Suspicious Windows Registry Event - Variant 2382
id: 7056c38a9a0731c7d68077cc9033c3f2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.discovery
    - attack.t1782
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2382.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2382'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

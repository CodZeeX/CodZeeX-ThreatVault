title: Detect Suspicious Windows Process Creation - Variant 2100
id: d1bea0edc8b1acbaac8c4ed73b897a35
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-26
tags:
    - attack.initial_access
    - attack.t1500
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2100.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2100'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 124
id: 2a934f41837f8a515efbfd3e8552b7d2
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-22
tags:
    - attack.defense_evasion
    - attack.t1124
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_124.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_124'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

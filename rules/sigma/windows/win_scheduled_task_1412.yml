title: Detect Suspicious Windows Scheduled Task Creation - Variant 1412
id: 1c8dbcbe5cfef2a254b27f40c3b68b99
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-15
tags:
    - attack.collection
    - attack.t1612
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1412.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1412'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

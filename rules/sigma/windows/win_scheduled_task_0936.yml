title: Detect Suspicious Windows Scheduled Task Creation - Variant 936
id: e638e4465ef27f8c6cc380eb170424be
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-17
tags:
    - attack.initial_access
    - attack.t1136
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_936.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_936'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

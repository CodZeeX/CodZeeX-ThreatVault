title: Detect Suspicious Windows Process Creation - Variant 910
id: bfc35b14676069da219df03f46461d69
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-15
tags:
    - attack.exfiltration
    - attack.t1110
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_910.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_910'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2640
id: 6bb6f9100b6e35bf3ade41f1062df486
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-28
tags:
    - attack.initial_access
    - attack.t1240
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2640.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2640'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2098
id: a7499614dde1276139cf1d1ae368d209
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-25
tags:
    - attack.exfiltration
    - attack.t1498
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2098.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2098'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

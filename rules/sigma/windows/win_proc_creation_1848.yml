title: Detect Suspicious Windows Process Creation - Variant 1848
id: 30bacd8cefd0f6343803940273a5e1cd
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-10
tags:
    - attack.initial_access
    - attack.t1248
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1848.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1848'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2394
id: 78f31c356e1870f54a64d40fbab6a5e8
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-12
tags:
    - attack.discovery
    - attack.t1794
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2394.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2394'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

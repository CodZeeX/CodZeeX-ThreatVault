title: Detect Suspicious Windows Network Connection - Variant 738
id: 6f9575f22832d21853f43beadbe6055c
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.discovery
    - attack.t1738
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_738.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_738'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 826
id: 6af49c4224523edca0f6c077b5a5e57e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.exfiltration
    - attack.t1026
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_826.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_826'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

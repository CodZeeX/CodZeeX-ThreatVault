title: Detect Suspicious Windows Scheduled Task Creation - Variant 1594
id: 650d89f23a44873c57f6c04fd1be26fb
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.exfiltration
    - attack.t1794
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1594.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1594'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 316
id: 48dc668d47ff7ab5948bd51433659510
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-03
tags:
    - attack.defense_evasion
    - attack.t1316
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_316.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_316'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

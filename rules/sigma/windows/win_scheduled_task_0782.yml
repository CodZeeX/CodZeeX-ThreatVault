title: Detect Suspicious Windows Scheduled Task Creation - Variant 782
id: 8a55595b8b55088860da6a98c00fac46
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-06
tags:
    - attack.persistence
    - attack.t1782
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_782.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_782'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

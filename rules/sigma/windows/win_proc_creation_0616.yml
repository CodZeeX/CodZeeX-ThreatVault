title: Detect Suspicious Windows Process Creation - Variant 616
id: 4004f5be7fcd5f257ccd05b8e854fc32
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-23
tags:
    - attack.defense_evasion
    - attack.t1616
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_616.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_616'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

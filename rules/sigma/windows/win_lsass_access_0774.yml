title: Detect Suspicious Windows Process Access - Variant 774
id: 31657e6b8a2bc00aa7ff641cfc38a12d
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-05
tags:
    - attack.discovery
    - attack.t1774
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_774.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_774'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 244
id: 4e0832c2d996ed6c32533e3af69f500d
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-29
tags:
    - attack.defense_evasion
    - attack.t1244
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_244.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_244'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1324
id: 018bf8e83beead58af6ee281b963f046
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.defense_evasion
    - attack.t1524
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1324.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1324'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

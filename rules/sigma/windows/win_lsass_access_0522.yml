title: Detect Suspicious Windows Process Access - Variant 522
id: a91d16fa9ec2c045e17f16327e5f8200
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-16
tags:
    - attack.discovery
    - attack.t1522
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_522.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_522'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

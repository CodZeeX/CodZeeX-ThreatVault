title: Detect Suspicious Windows Process Creation - Variant 1330
id: 58a41f0077549815cbb28cd119d251f6
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.exfiltration
    - attack.t1530
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1330.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1330'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

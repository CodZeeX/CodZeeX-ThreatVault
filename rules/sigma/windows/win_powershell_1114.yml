title: Detect Suspicious Windows Ps Script - Variant 1114
id: bb4cb51f34084247e6cb51c3f44b8d14
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.exfiltration
    - attack.t1314
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1114.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1114'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

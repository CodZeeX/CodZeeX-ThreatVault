title: Detect Suspicious Windows Registry Event - Variant 1038
id: e7b8a8b9a613750bac90706cb344ac90
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-24
tags:
    - attack.discovery
    - attack.t1238
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1038.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1038'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

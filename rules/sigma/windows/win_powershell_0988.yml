title: Detect Suspicious Windows Ps Script - Variant 988
id: 12db640e05fc73de4523820c519704b4
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-20
tags:
    - attack.defense_evasion
    - attack.t1188
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_988.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_988'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

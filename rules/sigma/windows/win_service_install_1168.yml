title: Detect Suspicious Windows Service Installation - Variant 1168
id: 4b70c341e3d7416c291d878f999e6a88
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.defense_evasion
    - attack.t1368
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1168.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1168'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1798
id: 520d75f8514144c361a83312b24c9107
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-07
tags:
    - attack.exfiltration
    - attack.t1198
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1798.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1798'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

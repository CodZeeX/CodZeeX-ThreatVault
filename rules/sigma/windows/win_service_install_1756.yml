title: Detect Suspicious Windows Service Installation - Variant 1756
id: bcd695429ec1a145ceb176f358c6a202
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.defense_evasion
    - attack.t1156
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1756.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1756'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 174
id: cefe5100094a20924a60845ae22bd710
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.discovery
    - attack.t1174
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_174.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_174'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

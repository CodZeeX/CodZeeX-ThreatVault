title: Detect Suspicious Windows Scheduled Task Creation - Variant 838
id: 1e5f9d972f28d7bb1f5c9c0f0a0fabf0
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.exfiltration
    - attack.t1038
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_838.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_838'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

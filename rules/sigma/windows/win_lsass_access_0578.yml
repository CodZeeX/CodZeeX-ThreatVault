title: Detect Suspicious Windows Process Access - Variant 578
id: b517849aaa979303725cf0816eca6938
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-20
tags:
    - attack.persistence
    - attack.t1578
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_578.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_578'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

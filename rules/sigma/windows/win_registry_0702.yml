title: Detect Suspicious Windows Registry Event - Variant 702
id: 27f354b272261f5cc83387ea7a57b8e2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.discovery
    - attack.t1702
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_702.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_702'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

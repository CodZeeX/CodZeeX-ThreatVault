title: Detect Suspicious Windows Registry Event - Variant 828
id: 78e16f9b3c7637390b751379f8da320a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.initial_access
    - attack.t1028
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_828.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_828'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 2008
id: 6e9fd9fbf4abc84d4dc730bf628a40d9
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.defense_evasion
    - attack.t1408
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2008.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2008'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

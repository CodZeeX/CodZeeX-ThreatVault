title: Detect Suspicious Windows Process Creation - Variant 126
id: f3368069067cc1e8fbf34f9b051501c3
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-22
tags:
    - attack.discovery
    - attack.t1126
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_126.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_126'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

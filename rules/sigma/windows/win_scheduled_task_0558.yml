title: Detect Suspicious Windows Scheduled Task Creation - Variant 558
id: 6a530fa722af2f74aa440c14263dd627
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-19
tags:
    - attack.discovery
    - attack.t1558
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_558.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_558'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 418
id: 0b7be0f1b1665ae4c10ad23410e94970
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-10
tags:
    - attack.exfiltration
    - attack.t1418
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_418.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_418'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

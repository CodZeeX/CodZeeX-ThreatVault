title: Detect Suspicious Windows Network Connection - Variant 1242
id: 5aea6ce75d3f1366839f84d017656a88
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.discovery
    - attack.t1442
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1242.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1242'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

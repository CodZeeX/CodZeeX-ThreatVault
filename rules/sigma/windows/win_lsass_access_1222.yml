title: Detect Suspicious Windows Process Access - Variant 1222
id: 1430525cdf9d3c612762ff94b93837e9
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.exfiltration
    - attack.t1422
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1222.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1222'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

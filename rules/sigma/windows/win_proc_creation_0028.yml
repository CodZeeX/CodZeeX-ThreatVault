title: Detect Suspicious Windows Process Creation - Variant 28
id: 5804445ea858583168af6fede4762da1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-15
tags:
    - attack.defense_evasion
    - attack.t1028
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_28.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_28'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 2650
id: 0e383be7a5a4bf14a75712d771627414
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-29
tags:
    - attack.exfiltration
    - attack.t1250
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2650.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2650'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

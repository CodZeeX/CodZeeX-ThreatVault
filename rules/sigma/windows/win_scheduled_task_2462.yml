title: Detect Suspicious Windows Scheduled Task Creation - Variant 2462
id: 88858779f265ebc3c017df017c8417d5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.persistence
    - attack.t1062
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2462.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2462'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

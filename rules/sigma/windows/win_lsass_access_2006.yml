title: Detect Suspicious Windows Process Access - Variant 2006
id: 0961ce0b8c6e3fa29d925f80a98ac5bb
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.persistence
    - attack.t1406
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2006.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2006'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

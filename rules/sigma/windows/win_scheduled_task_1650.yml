title: Detect Suspicious Windows Scheduled Task Creation - Variant 1650
id: c248514e43d69c7d982228ad05a03aa1
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.discovery
    - attack.t1050
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1650.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1650'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

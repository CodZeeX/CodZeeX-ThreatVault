title: Detect Suspicious Windows Scheduled Task Creation - Variant 250
id: 8f76d2d959f5e64e7c6ef6b5791841ed
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-29
tags:
    - attack.exfiltration
    - attack.t1250
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_250.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_250'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

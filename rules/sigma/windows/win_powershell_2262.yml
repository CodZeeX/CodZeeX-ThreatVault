title: Detect Suspicious Windows Ps Script - Variant 2262
id: 8b39db38bc19d27659d8e3a58cb502a4
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-04
tags:
    - attack.discovery
    - attack.t1662
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2262.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2262'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 624
id: 94dec3ab434347da83d3234cb3f63aff
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-24
tags:
    - attack.initial_access
    - attack.t1624
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_624.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_624'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 2138
id: eb68efc45514c4d7223a983d8e4b450a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-28
tags:
    - attack.persistence
    - attack.t1538
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2138.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2138'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

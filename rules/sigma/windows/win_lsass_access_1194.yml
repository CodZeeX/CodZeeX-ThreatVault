title: Detect Suspicious Windows Process Access - Variant 1194
id: de2e58322ad5a15f8f7a14347354a1e0
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-02
tags:
    - attack.discovery
    - attack.t1394
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1194.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1194'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

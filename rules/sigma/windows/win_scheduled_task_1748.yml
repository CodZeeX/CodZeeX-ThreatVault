title: Detect Suspicious Windows Scheduled Task Creation - Variant 1748
id: d4793dbf0d7c6739f272870b1f168506
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-04
tags:
    - attack.collection
    - attack.t1148
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1748.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1748'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

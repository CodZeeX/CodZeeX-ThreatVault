title: Detect Suspicious Windows Network Connection - Variant 472
id: 623595817228389d311b65ea60cd6dc0
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-13
tags:
    - attack.defense_evasion
    - attack.t1472
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_472.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_472'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

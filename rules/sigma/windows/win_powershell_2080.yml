title: Detect Suspicious Windows Ps Script - Variant 2080
id: 670ee93dae545d2ab637261a3ce22995
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.defense_evasion
    - attack.t1480
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2080.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2080'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

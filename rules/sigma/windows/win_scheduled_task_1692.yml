title: Detect Suspicious Windows Scheduled Task Creation - Variant 1692
id: 0807d54408af2b2c4cf980274c7c700f
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.initial_access
    - attack.t1092
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1692.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1692'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2452
id: 3ecb97732b5b87ec32e9853366bd23c1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.defense_evasion
    - attack.t1052
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2452.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2452'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

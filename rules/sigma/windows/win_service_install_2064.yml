title: Detect Suspicious Windows Service Installation - Variant 2064
id: a9f51f9f377fa38a36fa795ed27dc4cc
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-23
tags:
    - attack.initial_access
    - attack.t1464
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2064.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2064'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

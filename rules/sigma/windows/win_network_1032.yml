title: Detect Suspicious Windows Network Connection - Variant 1032
id: f4b2124b9c70e911b4ea8901df07f083
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-22
tags:
    - attack.initial_access
    - attack.t1232
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1032.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1032'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 696
id: fdbf2b9a8a849004e7e4862352cd9e8f
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.initial_access
    - attack.t1696
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_696.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_696'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

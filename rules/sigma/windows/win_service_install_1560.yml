title: Detect Suspicious Windows Service Installation - Variant 1560
id: 00272a3b8d62ef9bed411bb8597c9ed2
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.initial_access
    - attack.t1760
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1560.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1560'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

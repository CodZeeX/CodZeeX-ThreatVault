title: Detect Suspicious Windows Service Installation - Variant 1266
id: bc9e470f58dd79c96cf1bb41850fe271
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-06
tags:
    - attack.discovery
    - attack.t1466
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1266.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1266'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 1410
id: c2732c35c6601de252451db91e55b0e0
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-15
tags:
    - attack.discovery
    - attack.t1610
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1410.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1410'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

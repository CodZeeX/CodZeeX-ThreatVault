title: Detect Suspicious Windows Scheduled Task Creation - Variant 502
id: dab1f4e688356beb22db3071413cf791
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-15
tags:
    - attack.exfiltration
    - attack.t1502
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_502.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_502'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1868
id: 33e47c8fc378aa59593fb0ffb363af5b
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-11
tags:
    - attack.collection
    - attack.t1268
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1868.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1868'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

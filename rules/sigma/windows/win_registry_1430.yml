title: Detect Suspicious Windows Registry Event - Variant 1430
id: 3136f54721e48c49bdfb9c7ed438832a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-16
tags:
    - attack.persistence
    - attack.t1630
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1430.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1430'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1630
id: 588849ad56cf480638e15ff39ac78aed
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-27
tags:
    - attack.exfiltration
    - attack.t1030
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1630.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1630'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

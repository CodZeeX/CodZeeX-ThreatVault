title: Detect Suspicious Windows Process Access - Variant 1418
id: 952f9790a84c41c65a29fdc88368f9f8
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-15
tags:
    - attack.persistence
    - attack.t1618
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1418.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1418'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

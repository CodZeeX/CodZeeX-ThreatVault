title: Detect Suspicious Windows Registry Event - Variant 1794
id: aa3f7a90898a66ad50d374af619325d3
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-07
tags:
    - attack.discovery
    - attack.t1194
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1794.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1794'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

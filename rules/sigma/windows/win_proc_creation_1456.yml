title: Detect Suspicious Windows Process Creation - Variant 1456
id: 13b405628ddd378e0b3759b90f89e7c6
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.defense_evasion
    - attack.t1656
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1456.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1456'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

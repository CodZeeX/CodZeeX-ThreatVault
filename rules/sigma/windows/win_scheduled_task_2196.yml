title: Detect Suspicious Windows Scheduled Task Creation - Variant 2196
id: c77d526b4f36b1976ba94b802206692d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-31
tags:
    - attack.initial_access
    - attack.t1596
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2196.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2196'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

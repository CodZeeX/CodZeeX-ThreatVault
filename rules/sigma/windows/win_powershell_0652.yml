title: Detect Suspicious Windows Ps Script - Variant 652
id: a5acffb5783475e9e2ff8216dfeccaaa
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.defense_evasion
    - attack.t1652
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_652.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_652'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1322
id: 7ea541ceda3ae082377d6e67557dabe5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-10
tags:
    - attack.persistence
    - attack.t1522
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1322.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1322'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

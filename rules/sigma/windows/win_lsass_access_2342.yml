title: Detect Suspicious Windows Process Access - Variant 2342
id: bf5f0c5d6bc6503d922ca8027ad6da55
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-09
tags:
    - attack.persistence
    - attack.t1742
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2342.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2342'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

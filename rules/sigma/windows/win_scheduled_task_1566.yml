title: Detect Suspicious Windows Scheduled Task Creation - Variant 1566
id: c9c261770eec588ba3b94a1cc717f297
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.discovery
    - attack.t1766
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1566.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1566'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1944
id: 1b9ea4a63672764ab5f104d80f1eecdf
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.initial_access
    - attack.t1344
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1944.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1944'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

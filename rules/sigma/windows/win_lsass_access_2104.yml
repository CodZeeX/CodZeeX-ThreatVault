title: Detect Suspicious Windows Process Access - Variant 2104
id: d53967d1814b3420cb1993c007f5a4e0
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-26
tags:
    - attack.defense_evasion
    - attack.t1504
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2104.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2104'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

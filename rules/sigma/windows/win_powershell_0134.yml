title: Detect Suspicious Windows Ps Script - Variant 134
id: a3c21c3fd0dbedf7168320c6c4185b02
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-22
tags:
    - attack.persistence
    - attack.t1134
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_134.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_134'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

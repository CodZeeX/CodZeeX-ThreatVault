title: Detect Suspicious Windows Process Access - Variant 2286
id: 2fbca542f286ea9b2e88a5016b491929
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.discovery
    - attack.t1686
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2286.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2286'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

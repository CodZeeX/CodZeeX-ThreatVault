title: Detect Suspicious Windows Network Connection - Variant 2040
id: 769c05c90740863fc4b4c6feabb49fdc
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.initial_access
    - attack.t1440
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2040.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2040'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

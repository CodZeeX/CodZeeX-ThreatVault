title: Detect Suspicious Windows Process Creation - Variant 798
id: d9af8cb1d0e71648357c265acffd6395
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-07
tags:
    - attack.discovery
    - attack.t1798
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_798.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_798'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

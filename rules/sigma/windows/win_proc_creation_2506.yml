title: Detect Suspicious Windows Process Creation - Variant 2506
id: 2e178444966cbcc14a31d4fd4aade266
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-19
tags:
    - attack.exfiltration
    - attack.t1106
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2506.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2506'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

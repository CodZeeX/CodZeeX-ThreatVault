title: Detect Suspicious Windows Process Creation - Variant 2240
id: 4bdfdacd70c0ed705abada6bfb759b7c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.collection
    - attack.t1640
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2240.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2240'
    condition: selection
falsepositives:

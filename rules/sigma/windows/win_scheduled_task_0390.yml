title: Detect Suspicious Windows Scheduled Task Creation - Variant 390
id: 8aab1e52b3832398cc4377fbb409f78d
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-07
tags:
    - attack.discovery
    - attack.t1390
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_390.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_390'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

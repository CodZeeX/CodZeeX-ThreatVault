title: Detect Suspicious Windows Network Connection - Variant 1802
id: 2c3bda8d41d9298a4fa9aff2de32aad9
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-07
tags:
    - attack.persistence
    - attack.t1202
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1802.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1802'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

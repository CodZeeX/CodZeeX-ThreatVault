title: Detect Suspicious Windows Network Connection - Variant 752
id: 9916547ebadaa59ca49475b80ed9da6b
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-04
tags:
    - attack.collection
    - attack.t1752
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_752.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_752'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 2614
id: c2a241491c61bedb896a0b7970e07ced
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-27
tags:
    - attack.exfiltration
    - attack.t1214
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2614.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2614'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

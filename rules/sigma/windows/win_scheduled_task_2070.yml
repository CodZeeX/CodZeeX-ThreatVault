title: Detect Suspicious Windows Scheduled Task Creation - Variant 2070
id: aa0c237c025b3bd39c47b7134151f196
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.discovery
    - attack.t1470
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2070.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2070'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

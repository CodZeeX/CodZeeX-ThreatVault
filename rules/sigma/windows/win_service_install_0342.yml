title: Detect Suspicious Windows Service Installation - Variant 342
id: f34496497099678e3087c11eba4062f1
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-04
tags:
    - attack.discovery
    - attack.t1342
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_342.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_342'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 1570
id: ee435d83669d92ccb05c604bc6acbcaa
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.exfiltration
    - attack.t1770
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1570.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1570'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

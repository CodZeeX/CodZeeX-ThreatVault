title: Detect Suspicious Windows Scheduled Task Creation - Variant 26
id: 0ba3a2d1fe02462a4fcc545c24e5e841
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-15
tags:
    - attack.persistence
    - attack.t1026
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_26.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_26'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

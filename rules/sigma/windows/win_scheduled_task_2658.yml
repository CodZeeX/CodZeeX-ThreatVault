title: Detect Suspicious Windows Scheduled Task Creation - Variant 2658
id: aca6e7a2051bacebdcf3ba5c8228f362
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-30
tags:
    - attack.discovery
    - attack.t1258
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2658.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2658'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

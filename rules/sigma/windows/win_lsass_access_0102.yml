title: Detect Suspicious Windows Process Access - Variant 102
id: 92ac1a8cf8c5b80b7f2bbe4ad91dbce2
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-20
tags:
    - attack.discovery
    - attack.t1102
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_102.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_102'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

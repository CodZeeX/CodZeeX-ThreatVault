title: Detect Suspicious Windows Scheduled Task Creation - Variant 12
id: 0d25c753f69a4f818e05f5cbc4aeb8db
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-14
tags:
    - attack.initial_access
    - attack.t1012
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_12.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_12'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

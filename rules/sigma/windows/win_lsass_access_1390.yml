title: Detect Suspicious Windows Process Access - Variant 1390
id: a931ff9df470edbd8b86ced881ce213e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.exfiltration
    - attack.t1590
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1390.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1390'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

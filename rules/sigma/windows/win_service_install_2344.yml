title: Detect Suspicious Windows Service Installation - Variant 2344
id: c6d817ab6a336ccedf6e09cfc8925205
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-09
tags:
    - attack.defense_evasion
    - attack.t1744
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2344.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2344'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

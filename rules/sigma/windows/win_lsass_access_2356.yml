title: Detect Suspicious Windows Process Access - Variant 2356
id: a2794c262a26d53b3f0f325939dcb76b
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.defense_evasion
    - attack.t1756
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2356.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2356'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

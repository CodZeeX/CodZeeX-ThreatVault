title: Detect Suspicious Windows Scheduled Task Creation - Variant 2182
id: d773a419ed40ba4f1ff0f36c3678e502
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-30
tags:
    - attack.exfiltration
    - attack.t1582
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2182.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2182'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

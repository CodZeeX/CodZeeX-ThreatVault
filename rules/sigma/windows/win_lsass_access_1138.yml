title: Detect Suspicious Windows Process Access - Variant 1138
id: 43cb66e6544d3e123cecc057df936681
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-30
tags:
    - attack.exfiltration
    - attack.t1338
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1138.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1138'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2798
id: fe36c8361f516d9ce8ab3d327d7f8ce1
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-08
tags:
    - attack.persistence
    - attack.t1398
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2798.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2798'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

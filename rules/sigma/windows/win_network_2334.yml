title: Detect Suspicious Windows Network Connection - Variant 2334
id: 60edbf5db7fbd168147ab1fba7733170
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-08
tags:
    - attack.discovery
    - attack.t1734
logsource:

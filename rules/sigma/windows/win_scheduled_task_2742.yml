title: Detect Suspicious Windows Scheduled Task Creation - Variant 2742
id: d005fa8b080d0974acc41405d5c1fbc7
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.discovery
    - attack.t1342
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2742.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2742'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1846
id: 2d2daa1b2bac8e462f3f23d77de40ca0
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-10
tags:
    - attack.exfiltration
    - attack.t1246
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1846.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1846'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

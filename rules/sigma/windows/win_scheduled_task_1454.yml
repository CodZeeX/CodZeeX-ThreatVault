title: Detect Suspicious Windows Scheduled Task Creation - Variant 1454
id: f5f1bcf3f3f2bec62ebe528a5fcf9efd
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.persistence
    - attack.t1654
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1454.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1454'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

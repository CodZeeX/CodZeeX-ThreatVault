title: Detect Suspicious Windows Registry Event - Variant 1710
id: 31e5170895c527f87c8815e876381e9f
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-02
tags:
    - attack.discovery
    - attack.t1110
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1710.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1710'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

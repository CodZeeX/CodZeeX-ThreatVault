title: Detect Suspicious Windows Registry Event - Variant 1542
id: 00414d24fab826260b7307a8f6bdd475
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-22
tags:
    - attack.discovery
    - attack.t1742
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1542.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1542'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 14
id: 9a8ee12ffbfd11da0eebb9ee0e876016
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-14
tags:
    - attack.persistence
    - attack.t1014
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_14.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_14'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

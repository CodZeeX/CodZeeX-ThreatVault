title: Detect Suspicious Windows Scheduled Task Creation - Variant 1020
id: 757cae7cb9f324e60418297d325893d9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-22
tags:
    - attack.initial_access
    - attack.t1220
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1020.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1020'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

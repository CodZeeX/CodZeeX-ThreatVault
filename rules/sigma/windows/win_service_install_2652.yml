title: Detect Suspicious Windows Service Installation - Variant 2652
id: 1508732e11da51cc6c604cdbb64308f8
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-29
tags:
    - attack.initial_access
    - attack.t1252
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2652.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2652'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

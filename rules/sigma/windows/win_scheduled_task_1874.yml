title: Detect Suspicious Windows Scheduled Task Creation - Variant 1874
id: 0c6743bd500ba4e1f6a1a8ec8943b730
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-12
tags:
    - attack.persistence
    - attack.t1274
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1874.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1874'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

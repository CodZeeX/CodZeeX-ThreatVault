title: Detect Suspicious Windows Registry Event - Variant 1248
id: 3761c267e621ab809bd3431c589f63d2
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-05
tags:
    - attack.initial_access
    - attack.t1448
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1248.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1248'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

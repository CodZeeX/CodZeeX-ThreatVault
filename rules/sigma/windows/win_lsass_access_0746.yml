title: Detect Suspicious Windows Process Access - Variant 746
id: 3205db4937b564e412d50735881b2ef7
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.persistence
    - attack.t1746
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_746.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_746'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

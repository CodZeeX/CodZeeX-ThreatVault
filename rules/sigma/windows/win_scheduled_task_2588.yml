title: Detect Suspicious Windows Scheduled Task Creation - Variant 2588
id: 66db6b0bc942ed92bf1afbfcfaf62e68
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-25
tags:
    - attack.collection
    - attack.t1188
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2588.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2588'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

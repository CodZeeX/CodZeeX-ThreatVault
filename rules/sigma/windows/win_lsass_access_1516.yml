title: Detect Suspicious Windows Process Access - Variant 1516
id: f78f0125fbbcbb3caee97a1a02018b53
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-21
tags:
    - attack.defense_evasion
    - attack.t1716
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1516.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1516'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

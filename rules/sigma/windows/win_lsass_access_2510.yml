title: Detect Suspicious Windows Process Access - Variant 2510
id: dbc13427a62a7c2a17300a3f5fe6c976
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-20
tags:
    - attack.persistence
    - attack.t1110
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2510.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2510'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 772
id: b4765078d4121c0f353f8d5e7b28da53
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-05
tags:
    - attack.defense_evasion
    - attack.t1772
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_772.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_772'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

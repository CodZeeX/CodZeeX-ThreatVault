title: Detect Suspicious Windows Network Connection - Variant 1914
id: df5654a72a2c6d6cf8832f279756d918
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.discovery
    - attack.t1314
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1914.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1914'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

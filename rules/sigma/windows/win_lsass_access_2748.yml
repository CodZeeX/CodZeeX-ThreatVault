title: Detect Suspicious Windows Process Access - Variant 2748
id: be2d08632d1b95030aeca1a9b339655a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.initial_access
    - attack.t1348
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2748.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2748'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 1160
id: 4f835c004fdba2caba17aaa21719bb38
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.collection
    - attack.t1360
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1160.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1160'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

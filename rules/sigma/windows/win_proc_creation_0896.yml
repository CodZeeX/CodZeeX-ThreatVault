title: Detect Suspicious Windows Process Creation - Variant 896
id: a696edccbed502624df36b7dfebe3124
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-14
tags:
    - attack.collection
    - attack.t1096
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_896.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_896'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

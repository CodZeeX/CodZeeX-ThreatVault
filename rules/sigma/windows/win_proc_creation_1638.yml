title: Detect Suspicious Windows Process Creation - Variant 1638
id: fc650c506ce73d80adf1a0196bf0f10a
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.discovery
    - attack.t1038
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1638.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1638'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

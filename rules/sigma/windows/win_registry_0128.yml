title: Detect Suspicious Windows Registry Event - Variant 128
id: 66d265543f00edcc1668a55878cd94cb
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-22
tags:
    - attack.collection
    - attack.t1128
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_128.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_128'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

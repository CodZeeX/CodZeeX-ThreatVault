title: Detect Suspicious Windows Scheduled Task Creation - Variant 866
id: 40429e4906ac570106a3c04487b9b7e1
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-12
tags:
    - attack.persistence
    - attack.t1066
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_866.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_866'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1162
id: 8754010f57772aa41486179622e6a32f
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.exfiltration
    - attack.t1362
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1162.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1162'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

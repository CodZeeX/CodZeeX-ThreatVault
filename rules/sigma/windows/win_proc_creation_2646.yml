title: Detect Suspicious Windows Process Creation - Variant 2646
id: 6278b1bc88e07659aa4a0525041e8440
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-29
tags:
    - attack.discovery
    - attack.t1246
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2646.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2646'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

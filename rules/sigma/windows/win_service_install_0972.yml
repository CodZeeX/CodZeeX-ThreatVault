title: Detect Suspicious Windows Service Installation - Variant 972
id: 0303d639a23dc9950848c86a1ba4a377
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-20
tags:
    - attack.initial_access
    - attack.t1172
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_972.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_972'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

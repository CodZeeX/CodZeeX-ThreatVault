title: Detect Suspicious Windows Service Installation - Variant 146
id: b25f31c6ea1e372e24ec9ad2caad9de0
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-23
tags:
    - attack.persistence
    - attack.t1146
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_146.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_146'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

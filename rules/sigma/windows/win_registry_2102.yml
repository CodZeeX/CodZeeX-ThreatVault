title: Detect Suspicious Windows Registry Event - Variant 2102
id: 0996919f62b6fd11eb1f30a40377c64b
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-26
tags:
    - attack.persistence
    - attack.t1502
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2102.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2102'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

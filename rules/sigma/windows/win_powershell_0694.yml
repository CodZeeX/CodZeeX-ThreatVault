title: Detect Suspicious Windows Ps Script - Variant 694
id: 0721506ad94359d4ab66f483af6b8459
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.exfiltration
    - attack.t1694
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_694.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_694'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1470
id: 8105caa309af97a0568a6eaef8b93300
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-18
tags:
    - attack.discovery
    - attack.t1670
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1470.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1470'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 430
id: ab1077e323276b7d63827ec44d85312c
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.exfiltration
    - attack.t1430
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_430.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_430'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

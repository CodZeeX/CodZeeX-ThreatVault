title: Detect Suspicious Windows Registry Event - Variant 1206
id: 88d330329d3a74d314c0f3bc5531c3e9
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.discovery
    - attack.t1406
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1206.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1206'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

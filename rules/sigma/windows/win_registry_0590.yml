title: Detect Suspicious Windows Registry Event - Variant 590
id: 1a5aa66d156347a781025fa11a1d1762
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-21
tags:
    - attack.persistence
    - attack.t1590
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_590.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_590'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

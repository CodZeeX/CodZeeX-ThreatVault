title: Detect Suspicious Windows Service Installation - Variant 1644
id: 01e2c80d716b6a11024b52d72b96a383
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.initial_access
    - attack.t1044
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1644.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1644'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1166
id: 4e5d7f4e770273c096e69e1596f30772
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.persistence
    - attack.t1366
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1166.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1166'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1042
id: 473398b9f83981fdc8ca1b43ed08d00d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-24
tags:
    - attack.exfiltration
    - attack.t1242
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1042.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1042'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

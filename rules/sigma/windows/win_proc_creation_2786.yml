title: Detect Suspicious Windows Process Creation - Variant 2786
id: 600900c7be15ae218a44a3626fa0f748
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-07
tags:
    - attack.persistence
    - attack.t1386
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2786.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2786'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

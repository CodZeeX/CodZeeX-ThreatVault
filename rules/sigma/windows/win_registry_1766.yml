title: Detect Suspicious Windows Registry Event - Variant 1766
id: 77a30624d4c209612607df21b112437e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.persistence
    - attack.t1166
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1766.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1766'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

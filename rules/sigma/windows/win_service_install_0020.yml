title: Detect Suspicious Windows Service Installation - Variant 20
id: d823343accc6bb65e5b534d466e19aee
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-14
tags:
    - attack.collection
    - attack.t1020
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_20.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_20'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2014
id: 9c72f35f37344350520708eb14caecfb
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.exfiltration
    - attack.t1414
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2014.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2014'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

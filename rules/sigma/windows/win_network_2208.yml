title: Detect Suspicious Windows Network Connection - Variant 2208
id: 8382c23d2c7551cd9f9431cdd4f5bc8e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-01
tags:
    - attack.initial_access
    - attack.t1608
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2208.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2208'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

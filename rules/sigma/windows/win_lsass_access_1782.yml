title: Detect Suspicious Windows Process Access - Variant 1782
id: ea96036aa51ff6772352ea7da2385f12
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.discovery
    - attack.t1182
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1782.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1782'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

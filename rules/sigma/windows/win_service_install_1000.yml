title: Detect Suspicious Windows Service Installation - Variant 1000
id: d2fbeee994702391ebbbbbf33a6196b7
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.defense_evasion
    - attack.t1200
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1000.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1000'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

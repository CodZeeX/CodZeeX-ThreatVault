title: Detect Suspicious Windows Registry Event - Variant 1780
id: 4d132c6ec15625edde08face333de416
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.defense_evasion
    - attack.t1180
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1780.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1780'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

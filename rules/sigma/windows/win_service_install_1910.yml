title: Detect Suspicious Windows Service Installation - Variant 1910
id: 8dff7bca1fb9dcbe0dd5ee983e0ec69e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.persistence
    - attack.t1310
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1910.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1910'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

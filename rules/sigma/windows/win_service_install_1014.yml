title: Detect Suspicious Windows Service Installation - Variant 1014
id: ea6e6b2bfb73771177bb440679788011
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-22
tags:
    - attack.discovery
    - attack.t1214
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1014.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1014'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 688
id: 590613f85f696ee1b6e6ac9407691908
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-27
tags:
    - attack.defense_evasion
    - attack.t1688
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_688.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_688'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

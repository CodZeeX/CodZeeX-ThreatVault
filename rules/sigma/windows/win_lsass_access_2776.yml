title: Detect Suspicious Windows Process Access - Variant 2776
id: bdda585a1b36e5c08bc7a175e9494d4f
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-06
tags:
    - attack.defense_evasion
    - attack.t1376
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2776.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2776'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

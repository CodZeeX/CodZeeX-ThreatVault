title: Detect Suspicious Windows Ps Script - Variant 1408
id: fc23b060cb82756bb698ecb68490b016
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-15
tags:
    - attack.defense_evasion
    - attack.t1608
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1408.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1408'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

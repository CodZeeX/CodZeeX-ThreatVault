title: Detect Suspicious Windows Scheduled Task Creation - Variant 236
id: 6597ce03cb6ff675327a71e61c44c651
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-29
tags:
    - attack.collection
    - attack.t1236
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_236.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_236'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

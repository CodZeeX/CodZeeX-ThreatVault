title: Detect Suspicious Windows Scheduled Task Creation - Variant 362
id: 3a0b673c974c44d5479aa2a362ea80e3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-06
tags:
    - attack.persistence
    - attack.t1362
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_362.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_362'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

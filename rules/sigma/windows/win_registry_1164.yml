title: Detect Suspicious Windows Registry Event - Variant 1164
id: beea983e038c47064369f89d231266a9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.initial_access
    - attack.t1364
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1164.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1164'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

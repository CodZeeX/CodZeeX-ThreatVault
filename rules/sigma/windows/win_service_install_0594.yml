title: Detect Suspicious Windows Service Installation - Variant 594
id: 35d2c9399cca8da5f49e5a62f6251b0b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-21
tags:
    - attack.discovery
    - attack.t1594
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_594.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_594'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 120
id: 7b93c316094096fb0c7c1f4f3401fc73
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-21
tags:
    - attack.initial_access
    - attack.t1120
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_120.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_120'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

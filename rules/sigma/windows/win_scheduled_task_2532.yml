title: Detect Suspicious Windows Scheduled Task Creation - Variant 2532
id: 639db2ae55bce62f71010b2cb8767f91
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-21
tags:
    - attack.initial_access
    - attack.t1132
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2532.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2532'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2242
id: e90279eb7f17ce957d1b0d03d311cd53
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-03
tags:
    - attack.exfiltration
    - attack.t1642
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2242.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2242'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

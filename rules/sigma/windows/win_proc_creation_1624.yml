title: Detect Suspicious Windows Process Creation - Variant 1624
id: 76ff852fdee4af16c2565ce4724b1305
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-27
tags:
    - attack.defense_evasion
    - attack.t1024
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1624.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1624'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

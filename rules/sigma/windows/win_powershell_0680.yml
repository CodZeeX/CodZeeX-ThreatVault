title: Detect Suspicious Windows Ps Script - Variant 680
id: 0452c63f61d577ded56ed9986e1a2a11
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-27
tags:
    - attack.collection
    - attack.t1680
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_680.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_680'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

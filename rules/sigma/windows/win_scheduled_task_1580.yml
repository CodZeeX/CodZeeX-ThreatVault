title: Detect Suspicious Windows Scheduled Task Creation - Variant 1580
id: bfa25bbc08ca84940a0182ee5ba9262b
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.collection
    - attack.t1780
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1580.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1580'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

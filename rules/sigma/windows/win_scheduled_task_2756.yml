title: Detect Suspicious Windows Scheduled Task Creation - Variant 2756
id: d9dcc396975e28bb85ed8960febfca8d
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.collection
    - attack.t1356
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2756.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2756'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 580
id: e0ada0a699d787fe66447ffae68d7314
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-20
tags:
    - attack.defense_evasion
    - attack.t1580
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_580.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_580'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 1238
id: 1a04f902f6542033df988e180489de0d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.persistence
    - attack.t1438
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1238.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1238'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

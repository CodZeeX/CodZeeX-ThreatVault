title: Detect Suspicious Windows Process Creation - Variant 1358
id: c97dca016da9653f1318a5344cd75dca
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-12
tags:
    - attack.persistence
    - attack.t1558
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1358.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1358'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

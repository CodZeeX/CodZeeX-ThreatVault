title: Detect Suspicious Windows Registry Event - Variant 2200
id: 4530ad20edf2d7d5c6afbbe904835c03
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-31
tags:
    - attack.defense_evasion
    - attack.t1600
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2200.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2200'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

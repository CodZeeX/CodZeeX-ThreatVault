title: Detect Suspicious Windows Scheduled Task Creation - Variant 2504
id: 67bd610970096289f2bac8be73e3e7a8
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-19
tags:
    - attack.collection
    - attack.t1104
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2504.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2504'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1884
id: c293f5ff1adf597e482167f071b92ee8
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-13
tags:
    - attack.initial_access
    - attack.t1284
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1884.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1884'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

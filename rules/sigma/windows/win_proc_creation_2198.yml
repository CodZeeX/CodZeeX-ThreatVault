title: Detect Suspicious Windows Process Creation - Variant 2198
id: 23458318a2d7485157362a2df718bdd2
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-31
tags:
    - attack.persistence
    - attack.t1598
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2198.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2198'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 488
id: 4f07e1873ef4259c07e9a96ab66d0ca6
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.collection
    - attack.t1488
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_488.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_488'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

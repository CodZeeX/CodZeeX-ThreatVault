title: Detect Suspicious Windows Scheduled Task Creation - Variant 2322
id: 5dd550724aa31fc3e219ea3081ef2797
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-07
tags:
    - attack.discovery
    - attack.t1722
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2322.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2322'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

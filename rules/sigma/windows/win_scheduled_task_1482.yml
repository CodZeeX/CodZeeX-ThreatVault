title: Detect Suspicious Windows Scheduled Task Creation - Variant 1482
id: a1633191ac3fcc367be8266310902829
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.discovery
    - attack.t1682
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1482.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1482'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

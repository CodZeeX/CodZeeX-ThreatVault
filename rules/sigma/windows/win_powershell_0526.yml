title: Detect Suspicious Windows Ps Script - Variant 526
id: b0ff249128ef040fa2be0e80ce92b202
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-17
tags:
    - attack.exfiltration
    - attack.t1526
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_526.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_526'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

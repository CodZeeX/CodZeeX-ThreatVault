title: Detect Suspicious Windows Service Installation - Variant 1784
id: ebd4a129925ecd7044c6db1bf2642a85
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.collection
    - attack.t1184
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1784.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1784'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

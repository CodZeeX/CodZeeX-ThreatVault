title: Detect Suspicious Windows Process Access - Variant 2552
id: c29fb1801338b5cea4f2ca41c260c70a
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-23
tags:
    - attack.collection
    - attack.t1152
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2552.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2552'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

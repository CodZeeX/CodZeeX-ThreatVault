title: Detect Suspicious Windows Scheduled Task Creation - Variant 1622
id: 181a2391b6fd6ed9b7f3f629a0f8af03
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-27
tags:
    - attack.persistence
    - attack.t1022
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1622.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1622'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2136
id: ecc808dac2a12e424a48c604193b8810
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-27
tags:
    - attack.initial_access
    - attack.t1536
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2136.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2136'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

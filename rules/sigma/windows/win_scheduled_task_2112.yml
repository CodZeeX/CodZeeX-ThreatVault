title: Detect Suspicious Windows Scheduled Task Creation - Variant 2112
id: c99215a98b098c24a1d215ea2d92e393
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-26
tags:
    - attack.initial_access
    - attack.t1512
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2112.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2112'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

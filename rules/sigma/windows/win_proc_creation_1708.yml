title: Detect Suspicious Windows Process Creation - Variant 1708
id: ddaef044a3d8100cd7f977ac2e2d5280
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.defense_evasion
    - attack.t1108
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1708.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1708'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1520
id: 29894ee9034a59ca4ffdedd0badc00ad
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-21
tags:
    - attack.collection
    - attack.t1720
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1520.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1520'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

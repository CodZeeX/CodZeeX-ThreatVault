title: Detect Suspicious Windows Scheduled Task Creation - Variant 922
id: 6465f5a78e2e6a05033a282070410566
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-17
tags:
    - attack.exfiltration
    - attack.t1122
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_922.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_922'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

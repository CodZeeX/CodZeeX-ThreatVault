title: Detect Suspicious Windows Scheduled Task Creation - Variant 68
id: 19e9034a6938d3ae6909adb5f0759d55
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-17
tags:
    - attack.collection
    - attack.t1068
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_68.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_68'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2458
id: c1099639fe1fb9e198cd6dc6a85d14e7
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.exfiltration
    - attack.t1058
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2458.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2458'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 1626
id: 27393729e0bec858b2371155a7e0a16e
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-27
tags:
    - attack.discovery
    - attack.t1026
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1626.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1626'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 2256
id: 1f85d80652256d55445846816476b44a
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-04
tags:
    - attack.initial_access
    - attack.t1656
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2256.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2256'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

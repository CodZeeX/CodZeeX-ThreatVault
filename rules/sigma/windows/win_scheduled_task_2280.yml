title: Detect Suspicious Windows Scheduled Task Creation - Variant 2280
id: f0719a83ab52561544cc2f722fc84948
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.initial_access
    - attack.t1680
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2280.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2280'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

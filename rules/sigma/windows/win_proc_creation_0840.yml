title: Detect Suspicious Windows Process Creation - Variant 840
id: d8a03431a472d355e44ced3ab5a7809f
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.initial_access
    - attack.t1040
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_840.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_840'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

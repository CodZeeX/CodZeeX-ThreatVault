title: Detect Suspicious Windows Process Access - Variant 4
id: c1fb477c31320064a15b93f8fd1b7fc1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-13
tags:
    - attack.defense_evasion
    - attack.t1004
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_4.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_4'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

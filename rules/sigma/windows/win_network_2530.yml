title: Detect Suspicious Windows Network Connection - Variant 2530
id: 209b172e117f5c548cdc744ddc0d3fc2
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-21
tags:
    - attack.exfiltration
    - attack.t1130
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2530.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2530'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

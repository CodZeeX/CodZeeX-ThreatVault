title: Detect Suspicious Windows Service Installation - Variant 1154
id: 28cbac7436ed2a45e20c3c973221c6b5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.persistence
    - attack.t1354
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1154.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1154'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

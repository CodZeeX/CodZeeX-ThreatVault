title: Detect Suspicious Windows Service Installation - Variant 2372
id: ad742c758d1a5f753af263a5e483e80c
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.collection
    - attack.t1772
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2372.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2372'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

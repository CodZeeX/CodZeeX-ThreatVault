title: Detect Suspicious Windows Process Creation - Variant 2758
id: d27f9510e58321f6c958dae60ec00371
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.exfiltration
    - attack.t1358
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2758.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2758'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

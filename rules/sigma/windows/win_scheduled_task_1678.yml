title: Detect Suspicious Windows Scheduled Task Creation - Variant 1678
id: df6b7b8592a5bf6b8c22eb53b0eb759f
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-30
tags:
    - attack.exfiltration
    - attack.t1078
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1678.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1678'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

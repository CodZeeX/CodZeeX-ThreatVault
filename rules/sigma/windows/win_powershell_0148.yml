title: Detect Suspicious Windows Ps Script - Variant 148
id: f1c146d5aa8844caeef20b3c4f33f403
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-23
tags:
    - attack.defense_evasion
    - attack.t1148
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_148.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_148'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

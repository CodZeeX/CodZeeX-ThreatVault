title: Detect Suspicious Windows Ps Script - Variant 1786
id: e6b396194ba0c1a69c02ad4d78169f17
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-06
tags:
    - attack.exfiltration
    - attack.t1186
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1786.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1786'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

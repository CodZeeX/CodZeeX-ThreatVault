title: Detect Suspicious Windows Process Access - Variant 368
id: 792d359e8b82f18ace08bca87289dd40
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-06
tags:
    - attack.collection
    - attack.t1368
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_368.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_368'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

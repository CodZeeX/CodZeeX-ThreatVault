title: Detect Suspicious Windows Network Connection - Variant 1116
id: c17b7ccac706c613704b8208589c788b
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.initial_access
    - attack.t1316
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1116.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1116'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

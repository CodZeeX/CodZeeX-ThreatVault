title: Detect Suspicious Windows Ps Script - Variant 2388
id: 40c992273e7084965c4e72b863111522
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-12
tags:
    - attack.initial_access
    - attack.t1788
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2388.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2388'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

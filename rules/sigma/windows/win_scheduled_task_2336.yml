title: Detect Suspicious Windows Scheduled Task Creation - Variant 2336
id: 124a98d960668365afdea41b7a5e80b8
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-09
tags:
    - attack.collection
    - attack.t1736
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2336.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2336'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 2272
id: e90c8d5c76c4a74ec5221ed0beae96d5
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.defense_evasion
    - attack.t1672
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2272.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2272'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 54
id: 458f77eecba9bfc669797ed43f3c6988
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-16
tags:
    - attack.discovery
    - attack.t1054
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_54.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_54'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

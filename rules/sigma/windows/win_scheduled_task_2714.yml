title: Detect Suspicious Windows Scheduled Task Creation - Variant 2714
id: 52f51312eadccf19d5c83db356a08bf7
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.persistence
    - attack.t1314
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2714.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2714'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

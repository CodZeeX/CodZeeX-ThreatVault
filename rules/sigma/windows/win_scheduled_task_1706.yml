title: Detect Suspicious Windows Scheduled Task Creation - Variant 1706
id: 7ecaecedb21ee9e4978dc0f98a7eca09
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.persistence
    - attack.t1106
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1706.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1706'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

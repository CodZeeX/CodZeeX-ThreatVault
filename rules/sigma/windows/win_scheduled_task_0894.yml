title: Detect Suspicious Windows Scheduled Task Creation - Variant 894
id: bd74071344c0b861428cc92ed1be8d45
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-14
tags:
    - attack.discovery
    - attack.t1094
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_894.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_894'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 432
id: bbf8679d338ea660fd467876f3a2f3d9
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.initial_access
    - attack.t1432
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_432.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_432'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

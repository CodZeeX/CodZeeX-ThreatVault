title: Detect Suspicious Windows Registry Event - Variant 2284
id: f490d99f62147508caa164d07a2a3321
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.defense_evasion
    - attack.t1684
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2284.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2284'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

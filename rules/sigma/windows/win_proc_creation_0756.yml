title: Detect Suspicious Windows Process Creation - Variant 756
id: e5c98d5cc5c81ffe16a6fdb8cb2d1ced
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-04
tags:
    - attack.initial_access
    - attack.t1756
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_756.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_756'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 360
id: 058047afd34681b12e9c7dc2d99c41f3
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-06
tags:
    - attack.initial_access
    - attack.t1360
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_360.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_360'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

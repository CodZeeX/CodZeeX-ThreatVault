title: Detect Suspicious Windows Registry Event - Variant 856
id: d6279dcc8c64786939ac6e5a8c89f543
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.defense_evasion
    - attack.t1056
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_856.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_856'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

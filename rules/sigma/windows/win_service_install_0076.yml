title: Detect Suspicious Windows Service Installation - Variant 76
id: 712ed17137e4879c042c492514ff8ccb
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-17
tags:
    - attack.defense_evasion
    - attack.t1076
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_76.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_76'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

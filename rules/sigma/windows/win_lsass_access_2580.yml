title: Detect Suspicious Windows Process Access - Variant 2580
id: ec3269374824a74d22a7a55b8f93b67e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.initial_access
    - attack.t1180
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2580.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2580'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

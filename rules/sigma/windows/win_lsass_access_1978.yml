title: Detect Suspicious Windows Process Access - Variant 1978
id: 79704abe9d379c51e315c69571c59b5e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-19
tags:
    - attack.exfiltration
    - attack.t1378
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1978.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1978'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

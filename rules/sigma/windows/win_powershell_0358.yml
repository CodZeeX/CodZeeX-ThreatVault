title: Detect Suspicious Windows Ps Script - Variant 358
id: 6bec6b48179428c7067c34e363fd0f81
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-06
tags:
    - attack.exfiltration
    - attack.t1358
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_358.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_358'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 998
id: 285c2f99da4ab3c6c66dced70ac367c2
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.persistence
    - attack.t1198
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_998.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_998'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

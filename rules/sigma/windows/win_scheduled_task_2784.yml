title: Detect Suspicious Windows Scheduled Task Creation - Variant 2784
id: 07e19e34cba23dd136ccdb1a69beaef6
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-07
tags:
    - attack.initial_access
    - attack.t1384
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2784.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2784'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

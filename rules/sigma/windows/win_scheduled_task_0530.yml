title: Detect Suspicious Windows Scheduled Task Creation - Variant 530
id: 3b5e331a63a21f04d9f467794dabe43d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-17
tags:
    - attack.persistence
    - attack.t1530
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_530.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_530'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

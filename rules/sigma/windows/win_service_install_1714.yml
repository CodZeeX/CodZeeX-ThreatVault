title: Detect Suspicious Windows Service Installation - Variant 1714
id: eba7805317b24edef15b624440a8fa1d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-02
tags:
    - attack.exfiltration
    - attack.t1114
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1714.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1714'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

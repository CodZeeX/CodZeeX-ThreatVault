title: Detect Suspicious Windows Scheduled Task Creation - Variant 2770
id: 9764b8249bc0adb4fc8973b6dfa3082d
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-06
tags:
    - attack.exfiltration
    - attack.t1370
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2770.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2770'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

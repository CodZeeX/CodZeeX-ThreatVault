title: Detect Suspicious Windows Process Creation - Variant 182
id: e12da0cacd835b505b279529244f7367
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-25
tags:
    - attack.persistence
    - attack.t1182
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_182.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_182'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

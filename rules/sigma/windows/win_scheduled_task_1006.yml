title: Detect Suspicious Windows Scheduled Task Creation - Variant 1006
id: 44f2d583b1b04e2c4c92cf119db78f7f
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-21
tags:
    - attack.exfiltration
    - attack.t1206
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1006.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1006'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

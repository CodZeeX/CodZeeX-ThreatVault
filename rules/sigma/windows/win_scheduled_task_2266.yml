title: Detect Suspicious Windows Scheduled Task Creation - Variant 2266
id: 656bf10df7961c92037147a1c0e8c6e4
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-04
tags:
    - attack.exfiltration
    - attack.t1666
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2266.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2266'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

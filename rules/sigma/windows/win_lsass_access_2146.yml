title: Detect Suspicious Windows Process Access - Variant 2146
id: 5b2b9c9986f856e272737e3045d57ce2
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-28
tags:
    - attack.exfiltration
    - attack.t1546
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2146.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2146'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

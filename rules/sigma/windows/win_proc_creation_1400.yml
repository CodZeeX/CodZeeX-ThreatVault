title: Detect Suspicious Windows Process Creation - Variant 1400
id: 6283dbb05db9484b338057fac3c46c28
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.collection
    - attack.t1600
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1400.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1400'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

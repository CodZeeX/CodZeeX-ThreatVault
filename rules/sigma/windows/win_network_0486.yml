title: Detect Suspicious Windows Network Connection - Variant 486
id: d11add59bab599aef45d41ba9ed51cdf
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.discovery
    - attack.t1486
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_486.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_486'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

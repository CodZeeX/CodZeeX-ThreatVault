title: Detect Suspicious Windows Process Creation - Variant 224
id: a63f0a6c3848a5f1a58ea90aa38ed196
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-28
tags:
    - attack.collection
    - attack.t1224
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_224.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_224'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

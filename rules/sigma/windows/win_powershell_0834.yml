title: Detect Suspicious Windows Ps Script - Variant 834
id: a1fa765d09ba715891f1118e942e9080
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-10
tags:
    - attack.discovery
    - attack.t1034
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_834.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_834'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 1940
id: 087efa1bdd4a14bb5f473114c66c62e9
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.collection
    - attack.t1340
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1940.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1940'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2168
id: ac9e0235f114116f7ca30332146c685e
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-29
tags:
    - attack.collection
    - attack.t1568
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2168.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2168'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

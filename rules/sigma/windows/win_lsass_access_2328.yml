title: Detect Suspicious Windows Process Access - Variant 2328
id: 8b7deb7b906f589ea6aeb8da05d76a05
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-08
tags:
    - attack.initial_access
    - attack.t1728
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2328.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2328'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

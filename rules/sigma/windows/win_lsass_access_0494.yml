title: Detect Suspicious Windows Process Access - Variant 494
id: 314159fbd41ab49f00055f3aa0eeb48f
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-14
tags:
    - attack.persistence
    - attack.t1494
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_494.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_494'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

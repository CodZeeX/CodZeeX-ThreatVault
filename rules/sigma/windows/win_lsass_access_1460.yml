title: Detect Suspicious Windows Process Access - Variant 1460
id: 13136729dc45b26798bdca02a5768c14
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-17
tags:
    - attack.collection
    - attack.t1660
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1460.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1460'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

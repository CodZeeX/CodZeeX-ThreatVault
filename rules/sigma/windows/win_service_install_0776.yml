title: Detect Suspicious Windows Service Installation - Variant 776
id: 52151fd69fa6072bc5903865714f69f0
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-05
tags:
    - attack.collection
    - attack.t1776
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_776.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_776'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

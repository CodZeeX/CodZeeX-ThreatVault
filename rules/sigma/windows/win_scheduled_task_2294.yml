title: Detect Suspicious Windows Scheduled Task Creation - Variant 2294
id: 047a786fcf6e7e5126560015e9edc6ed
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.persistence
    - attack.t1694
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2294.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2294'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

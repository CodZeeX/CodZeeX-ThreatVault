title: Detect Suspicious Windows Process Access - Variant 2300
id: 227c48e16af653e411f1438a8e2e4036
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.collection
    - attack.t1700
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2300.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2300'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

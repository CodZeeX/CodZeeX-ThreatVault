title: Detect Suspicious Windows Ps Script - Variant 1562
id: 9a9693f1e5027ae90fc92c9a1de4e5d1
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-24
tags:
    - attack.persistence
    - attack.t1762
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1562.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1562'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

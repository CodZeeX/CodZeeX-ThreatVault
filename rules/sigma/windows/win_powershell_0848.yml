title: Detect Suspicious Windows Ps Script - Variant 848
id: 785a466f042be1d963e87b77fe18e073
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-11
tags:
    - attack.collection
    - attack.t1048
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_848.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_848'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

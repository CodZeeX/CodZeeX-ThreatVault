title: Detect Suspicious Windows Service Installation - Variant 650
id: bc5c39b071fb30bc3115f6287c04dd3e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.persistence
    - attack.t1650
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_650.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_650'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

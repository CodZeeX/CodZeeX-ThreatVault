title: Detect Suspicious Windows Registry Event - Variant 450
id: 3665712f796c52069eaa37834b141fc1
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-12
tags:
    - attack.discovery
    - attack.t1450
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_450.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_450'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

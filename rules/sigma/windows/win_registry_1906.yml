title: Detect Suspicious Windows Registry Event - Variant 1906
id: 897823b10ba824f5522cfbdc176a627c
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.exfiltration
    - attack.t1306
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1906.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1906'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

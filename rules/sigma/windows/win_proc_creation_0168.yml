title: Detect Suspicious Windows Process Creation - Variant 168
id: c8fb5ecc51203a4cc9d880326806224e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.initial_access
    - attack.t1168
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_168.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_168'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

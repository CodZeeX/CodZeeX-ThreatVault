title: Detect Suspicious Windows Service Installation - Variant 1308
id: e7fef8c6cc1fd4ec79c32520e5598a1d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-09
tags:
    - attack.initial_access
    - attack.t1508
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1308.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1308'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

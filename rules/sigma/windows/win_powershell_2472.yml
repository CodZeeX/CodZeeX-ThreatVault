title: Detect Suspicious Windows Ps Script - Variant 2472
id: 922bdf13af6f37b16b6b33537c737e1b
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-17
tags:
    - attack.initial_access
    - attack.t1072
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2472.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2472'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2364
id: 90dd78298d22f3e79e57b1c7b20c8d2e
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-10
tags:
    - attack.initial_access
    - attack.t1764
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2364.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2364'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

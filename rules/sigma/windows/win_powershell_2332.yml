title: Detect Suspicious Windows Ps Script - Variant 2332
id: da6a3422362e624481cd66b7f21573bd
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-08
tags:
    - attack.defense_evasion
    - attack.t1732
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2332.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2332'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

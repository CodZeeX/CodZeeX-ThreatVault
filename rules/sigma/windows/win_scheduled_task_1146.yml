title: Detect Suspicious Windows Scheduled Task Creation - Variant 1146
id: e8279a23e2e0988b899fad1edf0364f3
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.discovery
    - attack.t1346
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1146.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1146'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

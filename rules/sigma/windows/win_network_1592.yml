title: Detect Suspicious Windows Network Connection - Variant 1592
id: 60375e6e51fb787e53885a931ec7ea17
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.collection
    - attack.t1792
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1592.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1592'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2030
id: 4b6bb7cf5ac4e73aba525163bbe02e7e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.persistence
    - attack.t1430
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2030.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2030'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

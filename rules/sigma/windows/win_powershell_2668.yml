title: Detect Suspicious Windows Ps Script - Variant 2668
id: d7a22c7cbd63ca311261fa1687305ac1
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-30
tags:
    - attack.defense_evasion
    - attack.t1268
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2668.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2668'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Service Installation - Variant 6
id: 93b779caa2ea2ddc714f1044a323eea5
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-13
tags:
    - attack.discovery
    - attack.t1006
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_6.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_6'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 96
id: b105f0703b4d0945c772ed1c2dcf6348
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-20
tags:
    - attack.initial_access
    - attack.t1096
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_96.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_96'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

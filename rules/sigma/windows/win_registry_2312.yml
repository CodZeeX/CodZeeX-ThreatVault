title: Detect Suspicious Windows Registry Event - Variant 2312
id: e33912ac5278b936c22464f4dceb8f88
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.collection
    - attack.t1712
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2312.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2312'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

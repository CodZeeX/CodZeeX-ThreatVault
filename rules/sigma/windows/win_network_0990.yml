title: Detect Suspicious Windows Network Connection - Variant 990
id: 07ee128550d51cc5e01695ad8a0547f5
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-20
tags:
    - attack.discovery
    - attack.t1190
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_990.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_990'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

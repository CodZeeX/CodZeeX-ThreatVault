title: Detect Suspicious Windows Process Access - Variant 620
id: d97219a9d80d2b39adce498726064dc5
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-23
tags:
    - attack.collection
    - attack.t1620
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_620.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_620'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

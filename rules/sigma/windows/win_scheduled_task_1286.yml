title: Detect Suspicious Windows Scheduled Task Creation - Variant 1286
id: 57a43c8ebd64ed728df782f373a1d90a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-08
tags:
    - attack.persistence
    - attack.t1486
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1286.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1286'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

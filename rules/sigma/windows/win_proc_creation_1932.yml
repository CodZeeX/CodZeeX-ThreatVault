title: Detect Suspicious Windows Process Creation - Variant 1932
id: 4a15356832e09c724bb175906467a126
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-16
tags:
    - attack.initial_access
    - attack.t1332
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1932.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1932'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

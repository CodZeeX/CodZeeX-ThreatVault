title: Detect Suspicious Windows Process Creation - Variant 2226
id: c3881017c13ea7fa66869f4b1ea29b54
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-02
tags:
    - attack.discovery
    - attack.t1626
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2226.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2226'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

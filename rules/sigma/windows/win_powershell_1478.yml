title: Detect Suspicious Windows Ps Script - Variant 1478
id: 4c2164ada0e773761d4d3691a160fe23
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-18
tags:
    - attack.persistence
    - attack.t1678
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1478.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1478'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

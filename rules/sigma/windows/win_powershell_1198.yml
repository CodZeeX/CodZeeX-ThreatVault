title: Detect Suspicious Windows Ps Script - Variant 1198
id: 1e3ef8e0d392c98618d35456689dc579
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-02
tags:
    - attack.exfiltration
    - attack.t1398
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1198.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1198'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1120
id: 03dc929f70464d24403d60c046a870ae
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-28
tags:
    - attack.defense_evasion
    - attack.t1320
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1120.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1120'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

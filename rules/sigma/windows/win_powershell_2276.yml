title: Detect Suspicious Windows Ps Script - Variant 2276
id: e5410060b815e137cb9df21aee128fa0
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.collection
    - attack.t1676
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2276.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2276'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

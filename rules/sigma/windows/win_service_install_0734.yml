title: Detect Suspicious Windows Service Installation - Variant 734
id: 9ffb777946a9be2d2f27cb123649559c
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.persistence
    - attack.t1734
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_734.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_734'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

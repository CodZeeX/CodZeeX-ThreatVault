title: Detect Suspicious Windows Service Installation - Variant 1826
id: c18c38bb1a4653699a5829b3745680ff
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-09
tags:
    - attack.persistence
    - attack.t1226
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1826.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1826'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 2678
id: a58b85105522fedb4f35f2d3a5d0075a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.persistence
    - attack.t1278
logsource:
    category: process_access
    product: windows
detection:

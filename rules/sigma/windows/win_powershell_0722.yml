title: Detect Suspicious Windows Ps Script - Variant 722
id: 1750de83426206a6f38bd87545ad2d55
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-02
tags:
    - attack.persistence
    - attack.t1722
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_722.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_722'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

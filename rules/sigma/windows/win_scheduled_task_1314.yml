title: Detect Suspicious Windows Scheduled Task Creation - Variant 1314
id: 5e379a1bb5da8d238600dd69813a1275
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-09
tags:
    - attack.discovery
    - attack.t1514
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1314.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1314'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

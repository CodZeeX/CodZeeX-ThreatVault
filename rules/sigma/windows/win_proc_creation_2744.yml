title: Detect Suspicious Windows Process Creation - Variant 2744
id: 51f864baa55c9a59af4b410f5738fcde
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-04
tags:
    - attack.collection
    - attack.t1344
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2744.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2744'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

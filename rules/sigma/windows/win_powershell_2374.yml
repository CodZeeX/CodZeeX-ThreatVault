title: Detect Suspicious Windows Ps Script - Variant 2374
id: 7f94c6cb49e9168fc4ad47b380d73954
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-11
tags:
    - attack.exfiltration
    - attack.t1774
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2374.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2374'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

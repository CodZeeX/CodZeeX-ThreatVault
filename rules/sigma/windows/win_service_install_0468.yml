title: Detect Suspicious Windows Service Installation - Variant 468
id: 6a23eb814594093ed4b84badc7b66afa
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-13
tags:
    - attack.initial_access
    - attack.t1468
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_468.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_468'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

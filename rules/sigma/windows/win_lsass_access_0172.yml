title: Detect Suspicious Windows Process Access - Variant 172
id: 870ec7dc143c2ef40631dd14a99787ab
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.defense_evasion
    - attack.t1172
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_172.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_172'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

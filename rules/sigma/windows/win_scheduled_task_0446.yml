title: Detect Suspicious Windows Scheduled Task Creation - Variant 446
id: f8cb48aa57f9edaf14c2c8e50d1f6abc
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-12
tags:
    - attack.persistence
    - attack.t1446
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_446.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_446'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

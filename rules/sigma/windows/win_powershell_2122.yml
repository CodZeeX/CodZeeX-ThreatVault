title: Detect Suspicious Windows Ps Script - Variant 2122
id: da93b8e0bbd60023ca60db21b896a41e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-27
tags:
    - attack.exfiltration
    - attack.t1522
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2122.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2122'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 2020
id: 1e1d635d0954c3773329ebd3317fec05
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.defense_evasion
    - attack.t1420
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2020.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2020'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

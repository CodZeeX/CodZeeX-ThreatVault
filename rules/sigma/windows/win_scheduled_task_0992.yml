title: Detect Suspicious Windows Scheduled Task Creation - Variant 992
id: 3bab8b570a2161d0ae68acd76bf28d23
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-20
tags:
    - attack.collection
    - attack.t1192
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_992.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_992'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

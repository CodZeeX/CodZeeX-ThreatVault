title: Detect Suspicious Windows Ps Script - Variant 750
id: 027b2705ae5a35bec8f0e4c55e113361
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-04
tags:
    - attack.discovery
    - attack.t1750
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_750.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_750'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

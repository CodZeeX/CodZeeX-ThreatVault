title: Detect Suspicious Windows Scheduled Task Creation - Variant 166
id: bf70b66b787761ee9a448e20af63cb89
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.exfiltration
    - attack.t1166
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_166.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_166'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

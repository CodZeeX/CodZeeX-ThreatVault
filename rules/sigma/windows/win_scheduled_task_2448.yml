title: Detect Suspicious Windows Scheduled Task Creation - Variant 2448
id: 5bd2ae589957d6e726bd7102d1b99fa3
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-16
tags:
    - attack.initial_access
    - attack.t1048
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2448.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2448'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

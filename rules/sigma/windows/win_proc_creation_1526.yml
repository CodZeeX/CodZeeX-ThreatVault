title: Detect Suspicious Windows Process Creation - Variant 1526
id: 690168636ec396935c87368f85071de6
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-22
tags:
    - attack.persistence
    - attack.t1726
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1526.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1526'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

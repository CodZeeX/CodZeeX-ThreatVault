title: Detect Suspicious Windows Scheduled Task Creation - Variant 1230
id: 73e66263bd4842acea808909a4d59eec
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-03
tags:
    - attack.discovery
    - attack.t1430
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1230.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1230'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 672
id: 8129f6501ad7466b11fe136ae3d452cf
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-26
tags:
    - attack.initial_access
    - attack.t1672
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_672.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_672'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

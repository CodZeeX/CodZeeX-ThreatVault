title: Detect Suspicious Windows Process Access - Variant 2258
id: 2d01e14486eafcacf1caa7e8c5a78e4e
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-04
tags:
    - attack.persistence
    - attack.t1658
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2258.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2258'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

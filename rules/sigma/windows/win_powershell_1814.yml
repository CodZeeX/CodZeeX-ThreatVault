title: Detect Suspicious Windows Ps Script - Variant 1814
id: 42722ed641f73d840f5768ff619e897d
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-08
tags:
    - attack.persistence
    - attack.t1214
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1814.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1814'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

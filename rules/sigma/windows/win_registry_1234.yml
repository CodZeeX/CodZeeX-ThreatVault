title: Detect Suspicious Windows Registry Event - Variant 1234
id: 498a50f19ed6115e4c106f5eed858d07
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-04
tags:
    - attack.exfiltration
    - attack.t1434
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_1234.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1234'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 2674
id: 2f371cef3eabb35c43680784bd7c82b4
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.exfiltration
    - attack.t1274
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_2674.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2674'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 2734
id: 8fb92bba02b69c5aac709fd1faf4e2ca
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.exfiltration
    - attack.t1334
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2734.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2734'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Access - Variant 1698
id: fd2efa17f9c37e3e38771f044f2b807b
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-01
tags:
    - attack.discovery
    - attack.t1098
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1698.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1698'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

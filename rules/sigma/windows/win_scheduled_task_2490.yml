title: Detect Suspicious Windows Scheduled Task Creation - Variant 2490
id: d5d06afc2f166c3adf7344c1e9b7a09e
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-18
tags:
    - attack.discovery
    - attack.t1090
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2490.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2490'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

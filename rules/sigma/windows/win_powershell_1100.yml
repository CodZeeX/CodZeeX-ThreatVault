title: Detect Suspicious Windows Ps Script - Variant 1100
id: 6010e18b7a14f5e1fc2bd6f5f8766729
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-27
tags:
    - attack.collection
    - attack.t1300
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1100.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1100'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

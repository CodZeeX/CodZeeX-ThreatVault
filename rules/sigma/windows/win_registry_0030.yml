title: Detect Suspicious Windows Registry Event - Variant 30
id: fcb3f9e7b15564de8878b63b54a0bb32
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-15
tags:
    - attack.discovery
    - attack.t1030
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_30.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_30'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2126
id: 66fc8c115358025cb835f23c4e4600bf
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-27
tags:
    - attack.persistence
    - attack.t1526
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2126.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2126'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

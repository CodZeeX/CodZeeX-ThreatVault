title: Detect Suspicious Windows Service Installation - Variant 1546
id: 4b5458c6b07113ea1ce3116b178807d1
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-23
tags:
    - attack.exfiltration
    - attack.t1746
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1546.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1546'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

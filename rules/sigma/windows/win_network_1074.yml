title: Detect Suspicious Windows Network Connection - Variant 1074
id: f604ccfb2282bd5d754445b347489e26
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-26
tags:
    - attack.discovery
    - attack.t1274
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1074.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1074'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Ps Script - Variant 2290
id: a6d3d691401c693c3f353fa4b0699115
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-06
tags:
    - attack.exfiltration
    - attack.t1690
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2290.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2290'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Registry Event - Variant 604
id: 342024f513ce612aac4d305cd158a56a
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-22
tags:
    - attack.defense_evasion
    - attack.t1604
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_604.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_604'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 740
id: 5ed2acf3f75f31909be0ef4e6b991869
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-03
tags:
    - attack.collection
    - attack.t1740
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_740.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_740'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

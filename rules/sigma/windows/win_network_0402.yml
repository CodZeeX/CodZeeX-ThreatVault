title: Detect Suspicious Windows Network Connection - Variant 402
id: f550d7c1fe54c48ee0417e6340aedafe
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-09
tags:
    - attack.discovery
    - attack.t1402
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_402.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_402'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

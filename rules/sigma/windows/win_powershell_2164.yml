title: Detect Suspicious Windows Ps Script - Variant 2164
id: 65b39c3af18435bfd11338240d870d53
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-29
tags:
    - attack.defense_evasion
    - attack.t1564
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2164.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2164'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

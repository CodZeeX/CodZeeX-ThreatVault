title: Detect Suspicious Windows Network Connection - Variant 2222
id: bc629052a92e2f8cf4399b25190fdbaa
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-02
tags:
    - attack.persistence
    - attack.t1622
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2222.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2222'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

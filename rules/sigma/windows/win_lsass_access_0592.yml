title: Detect Suspicious Windows Process Access - Variant 592
id: 31297f99f7663023a7a627c2f674b9dc
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-21
tags:
    - attack.defense_evasion
    - attack.t1592
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_592.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_592'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

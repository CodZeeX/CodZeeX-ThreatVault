title: Detect Suspicious Windows Registry Event - Variant 2774
id: 41bbc84dc3d1d39dd68c506e51b5deed
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-06
tags:
    - attack.persistence
    - attack.t1374
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2774.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2774'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

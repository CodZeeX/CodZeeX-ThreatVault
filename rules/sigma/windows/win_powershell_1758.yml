title: Detect Suspicious Windows Ps Script - Variant 1758
id: ffa368af9efc986fdeca1cb8327fa831
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.discovery
    - attack.t1158
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1758.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1758'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

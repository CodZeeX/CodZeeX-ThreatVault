title: Detect Suspicious Windows Ps Script - Variant 2654
id: 7dbfdbc48b3d006e88d2455101e80aa5
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-29
tags:
    - attack.persistence
    - attack.t1254
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2654.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2654'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

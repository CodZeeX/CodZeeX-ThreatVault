title: Detect Suspicious Windows Process Access - Variant 2090
id: 02968ec63c0983f8cf1ba790c0cd0e76
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-25
tags:
    - attack.persistence
    - attack.t1490
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_2090.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2090'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

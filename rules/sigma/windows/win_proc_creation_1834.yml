title: Detect Suspicious Windows Process Creation - Variant 1834
id: 249018612ee8a5731d994f3513704fc2
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-09
tags:
    - attack.exfiltration
    - attack.t1234
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1834.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1834'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

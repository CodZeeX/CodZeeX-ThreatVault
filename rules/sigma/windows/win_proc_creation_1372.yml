title: Detect Suspicious Windows Process Creation - Variant 1372
id: b4b3ec8fb6fe7b226013d06a0a2f02fb
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-13
tags:
    - attack.defense_evasion
    - attack.t1572
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1372.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1372'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

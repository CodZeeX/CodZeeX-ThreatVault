title: Detect Suspicious Windows Process Creation - Variant 1442
id: ca4806be1a15974232f0f70c0d9bbaa6
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-16
tags:
    - attack.persistence
    - attack.t1642
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1442.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1442'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

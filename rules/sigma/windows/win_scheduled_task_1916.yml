title: Detect Suspicious Windows Scheduled Task Creation - Variant 1916
id: 98af2c8a46f5818223acb94234627873
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-14
tags:
    - attack.collection
    - attack.t1316
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1916.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1916'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

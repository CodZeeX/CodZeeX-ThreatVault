title: Detect Suspicious Windows Scheduled Task Creation - Variant 1258
id: cc327611222e9a11f8617f1429ca2c39
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-06
tags:
    - attack.exfiltration
    - attack.t1458
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1258.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1258'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

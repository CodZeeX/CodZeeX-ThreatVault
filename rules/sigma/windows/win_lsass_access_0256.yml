title: Detect Suspicious Windows Process Access - Variant 256
id: d79a9cdadb9cd605fd99148f9efab45f
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.defense_evasion
    - attack.t1256
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_256.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_256'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

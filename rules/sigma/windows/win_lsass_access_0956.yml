title: Detect Suspicious Windows Process Access - Variant 956
id: c48811aa517f710d1d694f2cc8966277
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-03-19
tags:
    - attack.collection
    - attack.t1156
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_956.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_956'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

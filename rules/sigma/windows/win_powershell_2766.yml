title: Detect Suspicious Windows Ps Script - Variant 2766
id: 798412d0172e3e87b8898ee3a7c4bb3d
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-07-05
tags:
    - attack.discovery
    - attack.t1366
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2766.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2766'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

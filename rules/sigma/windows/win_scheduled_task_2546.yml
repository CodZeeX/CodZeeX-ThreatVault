title: Detect Suspicious Windows Scheduled Task Creation - Variant 2546
id: 5122f22e9a91bf44199bf143cdcfcffd
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-22
tags:
    - attack.persistence
    - attack.t1146
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2546.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2546'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

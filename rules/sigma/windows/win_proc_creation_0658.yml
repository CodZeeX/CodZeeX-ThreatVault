title: Detect Suspicious Windows Process Creation - Variant 658
id: b4c9113cefd1b9e140119a7e7013860f
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-25
tags:
    - attack.exfiltration
    - attack.t1658
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_658.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_658'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

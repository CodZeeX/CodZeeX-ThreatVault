title: Detect Suspicious Windows Process Access - Variant 1306
id: 9ca7f7a9e76bc8c44d17949d509daf13
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-09
tags:
    - attack.exfiltration
    - attack.t1506
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1306.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1306'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

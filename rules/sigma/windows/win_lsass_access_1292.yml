title: Detect Suspicious Windows Process Access - Variant 1292
id: d1613d09541d58a9ac7c116e94cc8225
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-08
tags:
    - attack.collection
    - attack.t1492
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_1292.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1292'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

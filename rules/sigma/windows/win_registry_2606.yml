title: Detect Suspicious Windows Registry Event - Variant 2606
id: c679b06217d8fdb253fa3d657688651a
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-26
tags:
    - attack.persistence
    - attack.t1206
logsource:
    category: registry_event
    product: windows
detection:
    selection:
        Image|endswith:
            - 'registry_sample_2606.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2606'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Network Connection - Variant 1620
id: 853e1f51df621a81482f673d39a9594d
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-27
tags:
    - attack.initial_access
    - attack.t1020
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_1620.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1620'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

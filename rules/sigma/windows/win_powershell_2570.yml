title: Detect Suspicious Windows Ps Script - Variant 2570
id: dbdeb6dc40c871251c0082f67f3f731f
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-24
tags:
    - attack.persistence
    - attack.t1170
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_2570.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2570'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

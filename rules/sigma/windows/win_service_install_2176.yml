title: Detect Suspicious Windows Service Installation - Variant 2176
id: 8b0c0b19155b6e2f3890390d538aa7d7
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-30
tags:
    - attack.defense_evasion
    - attack.t1576
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2176.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2176'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

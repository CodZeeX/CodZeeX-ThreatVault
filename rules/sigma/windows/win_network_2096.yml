title: Detect Suspicious Windows Network Connection - Variant 2096
id: ca760f567ce8ab2e92d65d343956dfec
status: stable
description: Identifies anomalous and adversarial activity matching technique COLLECTION
references:
    - https://attack.mitre.org/tactics/collection
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-25
tags:
    - attack.collection
    - attack.t1496
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - 'network_sample_2096.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2096'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

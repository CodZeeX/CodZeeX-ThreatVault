title: Detect Suspicious Windows Service Installation - Variant 706
id: 29bdd487cae66dce8d628ece904fb3d3
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-28
tags:
    - attack.exfiltration
    - attack.t1706
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_706.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_706'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

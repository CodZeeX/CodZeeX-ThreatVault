title: Detect Suspicious Windows Ps Script - Variant 1170
id: dbc54d298f1749aa9eb47b4e1355a666
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.discovery
    - attack.t1370
logsource:
    category: ps_script
    product: windows
detection:
    selection:
        Image|endswith:
            - 'powershell_sample_1170.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1170'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

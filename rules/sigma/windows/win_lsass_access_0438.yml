title: Detect Suspicious Windows Process Access - Variant 438
id: f72f414dfad0760c0160f4246234cab0
status: stable
description: Identifies anomalous and adversarial activity matching technique DISCOVERY
references:
    - https://attack.mitre.org/tactics/discovery
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-02-11
tags:
    - attack.discovery
    - attack.t1438
logsource:
    category: process_access
    product: windows
detection:
    selection:
        Image|endswith:
            - 'lsass_access_sample_438.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_438'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

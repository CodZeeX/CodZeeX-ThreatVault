title: Detect Suspicious Windows Scheduled Task Creation - Variant 278
id: 480ec34c5abe82f1461691566c9d21c3
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-01-31
tags:
    - attack.persistence
    - attack.t1278
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_278.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_278'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Scheduled Task Creation - Variant 2210
id: a3c7412ddb2883e088c7b34cf50f5cdb
status: stable
description: Identifies anomalous and adversarial activity matching technique PERSISTENCE
references:
    - https://attack.mitre.org/tactics/persistence
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-06-01
tags:
    - attack.persistence
    - attack.t1610
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_2210.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2210'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

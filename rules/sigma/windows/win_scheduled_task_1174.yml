title: Detect Suspicious Windows Scheduled Task Creation - Variant 1174
id: bdf9d4db46b6bdb34ddfc728e64a54c5
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-01
tags:
    - attack.exfiltration
    - attack.t1374
logsource:
    category: scheduled_task_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'scheduled_task_sample_1174.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1174'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

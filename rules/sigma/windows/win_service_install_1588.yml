title: Detect Suspicious Windows Service Installation - Variant 1588
id: 5ae47804f737026115606b04b0f007ca
status: stable
description: Identifies anomalous and adversarial activity matching technique DEFENSE_EVASION
references:
    - https://attack.mitre.org/tactics/defense_evasion
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-25
tags:
    - attack.defense_evasion
    - attack.t1788
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1588.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1588'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

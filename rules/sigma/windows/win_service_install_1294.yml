title: Detect Suspicious Windows Service Installation - Variant 1294
id: b5014966c78c264be6e764006c438b3e
status: stable
description: Identifies anomalous and adversarial activity matching technique EXFILTRATION
references:
    - https://attack.mitre.org/tactics/exfiltration
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-04-08
tags:
    - attack.exfiltration
    - attack.t1494
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_1294.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1294'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

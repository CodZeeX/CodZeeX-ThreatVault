title: Detect Suspicious Windows Service Installation - Variant 2148
id: 41da654ac2e969f45ea70d52699aa13f
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-28
tags:
    - attack.initial_access
    - attack.t1548
logsource:
    category: service_installation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'service_install_sample_2148.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_2148'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

title: Detect Suspicious Windows Process Creation - Variant 1764
id: 40b63bbea6630dffcfecf24dd86c60d1
status: stable
description: Identifies anomalous and adversarial activity matching technique INITIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/initial_access
    - https://github.com/CodZeeX
author: RobsHs (CodZeeX)
date: 2025-05-05
tags:
    - attack.initial_access
    - attack.t1164
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - 'proc_creation_sample_1764.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - 'token_stealer_1764'
    condition: selection
falsepositives:
    - Authorized administrative maintenance scripts
level: high

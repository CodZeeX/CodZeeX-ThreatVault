title: Detect Suspicious Linux File Modification - Pattern 893
id: b41972925958f32767739427d247b61a
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-03-14
tags:
    - attack.credential_access
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_893.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

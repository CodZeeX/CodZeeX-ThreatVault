title: Detect Suspicious Linux Privilege Escalation - Pattern 121
id: a24437f9ba058f8eaedc960e0dfd7871
status: stable
description: Identifies suspicious Linux event matching EXECUTION
references:
    - https://attack.mitre.org/tactics/execution
author: RobsHs (CodZeeX)
date: 2025-01-21
tags:
    - attack.execution
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_121.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

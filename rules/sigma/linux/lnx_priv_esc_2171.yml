title: Detect Suspicious Linux Privilege Escalation - Pattern 2171
id: 9a6bfc848b34fd7280aa4f988b68cec3
status: stable
description: Identifies suspicious Linux event matching IMPACT
references:
    - https://attack.mitre.org/tactics/impact
author: RobsHs (CodZeeX)
date: 2025-05-29
tags:
    - attack.impact
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2171.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

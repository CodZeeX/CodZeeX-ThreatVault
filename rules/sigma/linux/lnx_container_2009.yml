title: Detect Suspicious Linux Container Escape - Pattern 2009
id: ff96a15f64ef681b8f057e0eeb80c855
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.credential_access
logsource:
    category: container_escape
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2009.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

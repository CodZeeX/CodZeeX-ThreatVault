title: Detect Suspicious Linux Persistence Cron - Pattern 1387
id: 01e7be7c4990b92d4c5b75ee3c244f65
status: stable
description: Identifies suspicious Linux event matching LATERAL_MOVEMENT
references:
    - https://attack.mitre.org/tactics/lateral_movement
author: RobsHs (CodZeeX)
date: 2025-04-14
tags:
    - attack.lateral_movement
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1387.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

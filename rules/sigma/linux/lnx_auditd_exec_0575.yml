title: Detect Suspicious Linux Process Creation - Pattern 575
id: 78184a4a554fafdc07686fc9ca1ec131
status: stable
description: Identifies suspicious Linux event matching IMPACT
references:
    - https://attack.mitre.org/tactics/impact
author: RobsHs (CodZeeX)
date: 2025-02-20
tags:
    - attack.impact
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_575.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

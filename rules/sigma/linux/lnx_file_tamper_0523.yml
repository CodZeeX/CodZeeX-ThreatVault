title: Detect Suspicious Linux File Modification - Pattern 523
id: 233835265246b48fffe63d4973312f57
status: stable
description: Identifies suspicious Linux event matching LATERAL_MOVEMENT
references:
    - https://attack.mitre.org/tactics/lateral_movement
author: RobsHs (CodZeeX)
date: 2025-02-16
tags:
    - attack.lateral_movement
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_523.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

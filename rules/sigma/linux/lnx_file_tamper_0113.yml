title: Detect Suspicious Linux File Modification - Pattern 113
id: ee58998756d2f8832c26caad951afda8
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-01-21
tags:
    - attack.credential_access
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_113.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

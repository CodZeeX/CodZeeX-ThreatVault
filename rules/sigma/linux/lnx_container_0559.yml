title: Detect Suspicious Linux Container Escape - Pattern 559
id: c70fc0a6f6aef6390cf749da0174b4d0
status: stable
description: Identifies suspicious Linux event matching LATERAL_MOVEMENT
references:
    - https://attack.mitre.org/tactics/lateral_movement
author: RobsHs (CodZeeX)
date: 2025-02-19
tags:
    - attack.lateral_movement
logsource:
    category: container_escape
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_559.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

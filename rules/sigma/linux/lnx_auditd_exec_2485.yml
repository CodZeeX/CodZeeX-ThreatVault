title: Detect Suspicious Linux Process Creation - Pattern 2485
id: e1293d8043d527ff35c6d150cf605901
status: stable
description: Identifies suspicious Linux event matching EXECUTION
references:
    - https://attack.mitre.org/tactics/execution
author: RobsHs (CodZeeX)
date: 2025-06-18
tags:
    - attack.execution
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2485.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

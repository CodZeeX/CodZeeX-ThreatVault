title: Detect Suspicious Linux Process Creation - Pattern 1145
id: 9613ed55996b0e3634ea0712f2af2d8e
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-03-31
tags:
    - attack.credential_access
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1145.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

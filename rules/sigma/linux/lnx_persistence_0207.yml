title: Detect Suspicious Linux Persistence Cron - Pattern 207
id: f99cb8abad1be4959aba0d92bb181901
status: stable
description: Identifies suspicious Linux event matching PRIVILEGE_ESCALATION
references:
    - https://attack.mitre.org/tactics/privilege_escalation
author: RobsHs (CodZeeX)
date: 2025-01-27
tags:
    - attack.privilege_escalation
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_207.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

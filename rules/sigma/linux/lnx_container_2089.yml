title: Detect Suspicious Linux Container Escape - Pattern 2089
id: 66ca32259ac3769113b04041c743da18
status: stable
description: Identifies suspicious Linux event matching EXECUTION
references:
    - https://attack.mitre.org/tactics/execution
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.execution
logsource:
    category: container_escape
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2089.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

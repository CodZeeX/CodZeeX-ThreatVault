title: Detect Suspicious Linux Process Creation - Pattern 2075
id: 91fb0242a5a6b82e7f28e938f0c06577
status: stable
description: Identifies suspicious Linux event matching IMPACT
references:
    - https://attack.mitre.org/tactics/impact
author: RobsHs (CodZeeX)
date: 2025-05-24
tags:
    - attack.impact
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2075.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux File Modification - Pattern 1663
id: 9818278283bd28c763c4c2065b0aee97
status: stable
description: Identifies suspicious Linux event matching LATERAL_MOVEMENT
references:
    - https://attack.mitre.org/tactics/lateral_movement
author: RobsHs (CodZeeX)
date: 2025-04-29
tags:
    - attack.lateral_movement
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1663.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux Persistence Cron - Pattern 1607
id: 3f6e82078d11f9b1086af6b01f856b6b
status: stable
description: Identifies suspicious Linux event matching IMPACT
references:
    - https://attack.mitre.org/tactics/impact
author: RobsHs (CodZeeX)
date: 2025-04-26
tags:
    - attack.impact
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1607.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

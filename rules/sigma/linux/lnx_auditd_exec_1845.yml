title: Detect Suspicious Linux Process Creation - Pattern 1845
id: a6ea93a2dfa2740f445deb2a8c91e8df
status: stable
description: Identifies suspicious Linux event matching COMMAND_AND_CONTROL
references:
    - https://attack.mitre.org/tactics/command_and_control
author: RobsHs (CodZeeX)
date: 2025-05-10
tags:
    - attack.command_and_control
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1845.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux Process Creation - Pattern 2685
id: 34a554f907622b8b9bf3e57b2b033207
status: stable
description: Identifies suspicious Linux event matching COMMAND_AND_CONTROL
references:
    - https://attack.mitre.org/tactics/command_and_control
author: RobsHs (CodZeeX)
date: 2025-07-01
tags:
    - attack.command_and_control
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2685.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

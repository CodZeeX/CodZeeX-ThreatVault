title: Detect Suspicious Linux File Modification - Pattern 1483
id: 960398af848183da045bc52a9baba4aa
status: stable
description: Identifies suspicious Linux event matching LATERAL_MOVEMENT
references:
    - https://attack.mitre.org/tactics/lateral_movement
author: RobsHs (CodZeeX)
date: 2025-04-19
tags:
    - attack.lateral_movement
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1483.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

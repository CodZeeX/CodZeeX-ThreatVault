title: Detect Suspicious Linux Privilege Escalation - Pattern 1641
id: 4e02f5f28b9f445fe9401f28a505f506
status: stable
description: Identifies suspicious Linux event matching COMMAND_AND_CONTROL
references:
    - https://attack.mitre.org/tactics/command_and_control
author: RobsHs (CodZeeX)
date: 2025-04-28
tags:
    - attack.command_and_control
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1641.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux Container Escape - Pattern 2029
id: afa6d628657e8820900812817685694d
status: stable
description: Identifies suspicious Linux event matching EXECUTION
references:
    - https://attack.mitre.org/tactics/execution
author: RobsHs (CodZeeX)
date: 2025-05-21
tags:
    - attack.execution
logsource:
    category: container_escape
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2029.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux File Modification - Pattern 2333
id: 8e96871f149f240ef3a7c649668a825d
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-06-08
tags:
    - attack.credential_access
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2333.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

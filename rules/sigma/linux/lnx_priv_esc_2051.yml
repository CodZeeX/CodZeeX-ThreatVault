title: Detect Suspicious Linux Privilege Escalation - Pattern 2051
id: 511a34ce88c2ff34a4c16ac8f3534406
status: stable
description: Identifies suspicious Linux event matching IMPACT
references:
    - https://attack.mitre.org/tactics/impact
author: RobsHs (CodZeeX)
date: 2025-05-22
tags:
    - attack.impact
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2051.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

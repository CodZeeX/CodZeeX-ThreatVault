title: Detect Suspicious Linux Privilege Escalation - Pattern 2481
id: 6c501286c2d11047cdd13d25aaf0e513
status: stable
description: Identifies suspicious Linux event matching COMMAND_AND_CONTROL
references:
    - https://attack.mitre.org/tactics/command_and_control
author: RobsHs (CodZeeX)
date: 2025-06-18
tags:
    - attack.command_and_control
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2481.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

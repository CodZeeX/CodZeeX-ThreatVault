title: Detect Suspicious Linux Container Escape - Pattern 1029
id: 035ce1b699f90def6aa93c6af1b20570
status: stable
description: Identifies suspicious Linux event matching COMMAND_AND_CONTROL
references:
    - https://attack.mitre.org/tactics/command_and_control
author: RobsHs (CodZeeX)
date: 2025-03-22
tags:
    - attack.command_and_control
logsource:
    category: container_escape
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1029.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

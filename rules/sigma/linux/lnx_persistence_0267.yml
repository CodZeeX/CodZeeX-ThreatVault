title: Detect Suspicious Linux Persistence Cron - Pattern 267
id: 0cc93c1a3ad5030b8c4cfbacb565ae55
status: stable
description: Identifies suspicious Linux event matching PRIVILEGE_ESCALATION
references:
    - https://attack.mitre.org/tactics/privilege_escalation
author: RobsHs (CodZeeX)
date: 2025-01-30
tags:
    - attack.privilege_escalation
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_267.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

title: Detect Suspicious Linux Persistence Cron - Pattern 2727
id: e96fbd1edfb2886db00196ce1514fc6d
status: stable
description: Identifies suspicious Linux event matching PRIVILEGE_ESCALATION
references:
    - https://attack.mitre.org/tactics/privilege_escalation
author: RobsHs (CodZeeX)
date: 2025-07-03
tags:
    - attack.privilege_escalation
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2727.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

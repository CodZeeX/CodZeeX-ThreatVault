title: Detect Suspicious Linux Persistence Cron - Pattern 1467
id: a542341fe9930e300d3c4b6aa64dd8d2
status: stable
description: Identifies suspicious Linux event matching PRIVILEGE_ESCALATION
references:
    - https://attack.mitre.org/tactics/privilege_escalation
author: RobsHs (CodZeeX)
date: 2025-04-18
tags:
    - attack.privilege_escalation
logsource:
    category: persistence_cron
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1467.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

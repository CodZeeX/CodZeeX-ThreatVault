title: Detect Suspicious Linux File Modification - Pattern 1093
id: 47655091289fc1aa1006033f552c7ef0
status: stable
description: Identifies suspicious Linux event matching EXECUTION
references:
    - https://attack.mitre.org/tactics/execution
author: RobsHs (CodZeeX)
date: 2025-03-27
tags:
    - attack.execution
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_1093.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

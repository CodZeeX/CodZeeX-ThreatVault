title: Detect Suspicious Linux Privilege Escalation - Pattern 161
id: f9fa8edc0b8ec340fb331062b166c0ea
status: stable
description: Identifies suspicious Linux event matching CREDENTIAL_ACCESS
references:
    - https://attack.mitre.org/tactics/credential_access
author: RobsHs (CodZeeX)
date: 2025-01-24
tags:
    - attack.credential_access
logsource:
    category: privilege_escalation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_161.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium

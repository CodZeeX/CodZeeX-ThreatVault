title: Detect Suspicious Linux File Modification - Pattern 2283
id: e67cf146262428a7f349e6f62a665837
status: stable
description: Identifies suspicious Linux event matching PRIVILEGE_ESCALATION
references:
    - https://attack.mitre.org/tactics/privilege_escalation
author: RobsHs (CodZeeX)
date: 2025-06-05
tags:
    - attack.privilege_escalation
logsource:
    category: file_modification
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'sudo -S'
            - 'insmod suspicious_2283.ko'
            - '/bin/nc -e /bin/sh'
    condition: selection
falsepositives:
    - Scheduled system backup scripts
level: medium
